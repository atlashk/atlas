apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: payment-service-logs
  labels:
    app: payment-service
    tier: application
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: hostpath  # Use Docker Desktop default storage class
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    app: payment-service
    tier: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
        tier: application
    spec:
      containers:
        - name: payment-service
          image: atlas-payment-service:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: payment-service-config
            - secretRef:
                name: payment-service-secret
          ports:
            - containerPort: 8084
              name: http
          # Health checks
          # Strategy: Product service takes 3-4 minutes to start successfully
          # Optimized probe configuration for Spring Boot microservice with dependencies (DB, Redis, Kafka)
          # 1. Startup probe: Fast detection of startup completion with exponential backoff-like behavior
          # 2. Readiness probe: Frequent checks for traffic routing decisions  
          # 3. Liveness probe: Conservative monitoring to avoid unnecessary restarts
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
              scheme: HTTP
            initialDelaySeconds: 240  # Start 4 minutes after container start (conservative)
            periodSeconds: 45         # Check every 45 seconds (less aggressive)
            timeoutSeconds: 15        # Allow 15 seconds for response (network delays)
            failureThreshold: 10      # Restart only after 10 consecutive failures (7m30s grace)
            successThreshold: 1       # Back to healthy after 1 success
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
              scheme: HTTP
            initialDelaySeconds: 180  # Start 3 minutes after container start
            periodSeconds: 5          # Check every 5 seconds (responsive traffic routing)
            timeoutSeconds: 3         # Quick timeout for readiness decisions
            successThreshold: 1       # Ready after 1 success
            failureThreshold: 6       # Remove from service after 6 failures (30s grace)
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8084
              scheme: HTTP
            initialDelaySeconds: 120  # Start checking after 2 minutes
            periodSeconds: 10         # Check every 10 seconds (more responsive)
            timeoutSeconds: 5         # Quick timeout for startup checks
            failureThreshold: 18      # Allow 18 failures = 120s + (10s × 18) = 300s = 5 minutes total
          # Resource optimization
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: payment-service-logs
              mountPath: /var/log/payment-service
      volumes:
        - name: payment-service-logs
          persistentVolumeClaim:
            claimName: payment-service-logs
      # Graceful shutdown configuration for Kubernetes pods
      # When a pod is terminated, Kubernetes follows this graceful shutdown process:
      # 1. Pod is marked as "Terminating" and removed from service endpoints
      # 2. SIGTERM signal is sent to all containers in the pod
      # 3. Application should handle SIGTERM to begin graceful shutdown:
      #    - Stop accepting new requests
      #    - Complete processing of existing requests
      #    - Close database connections and release resources
      #    - Perform cleanup operations
      # 4. If the process doesn't exit within the grace period (Default is 30 seconds if not specified), SIGKILL is sent
      # 5. Pod is removed from the cluster
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  labels:
    app: payment-service
    tier: application
spec:
  selector:
    app: payment-service
  ports:
    - port: 8084
      targetPort: 8084
      name: http
  type: ClusterIP
