# =============================================================================
# Payment Service
# =============================================================================

services:
  payment-service:
    container_name: payment-service
    image: atlas-payment-service
    ports:
      - "8084:8084"
    env_file: "../../.env/payment-service.env"
    volumes:
      - payment-service-log:/var/log/payment-service
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8084/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - atlas-network

volumes:
  payment-service-log:

# Network is defined globally in main docker-compose.yml
