# =============================================================================
# Notification Service
# =============================================================================

services:
  notification-service:
    container_name: notification-service
    image: atlas-notification-service
    ports:
      - "8085:8085"
    env_file: "../../.env/notification-service.env"
    volumes:
      - notification-service-log:/var/log/notification-service
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8085/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - atlas-network

volumes:
  notification-service-log:

# Network is defined globally in main docker-compose.yml
