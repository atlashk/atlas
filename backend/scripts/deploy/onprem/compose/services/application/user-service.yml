# =============================================================================
# User Service
# =============================================================================

services:
  user-service:
    container_name: user-service
    image: atlas-user-service
    ports:
      - "8081:8081"
    env_file: "../../env/user-service.env"
    volumes:
      - user-service-log:/var/log/user-service
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - atlas-network

volumes:
  user-service-log:

# Network is defined globally in main docker-compose.yml
