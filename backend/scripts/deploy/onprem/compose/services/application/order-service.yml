# =============================================================================
# Order Service
# =============================================================================

services:
  order-service:
    container_name: order-service
    image: atlas-order-service
    ports:
      - "8083:8083"
    env_file: "../../.env/order-service.env"
    volumes:
      - order-service-log:/var/log/order-service
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - atlas-network

volumes:
  order-service-log:

# Network is defined globally in main docker-compose.yml
