# =============================================================================
# Redis Cache Service
# =============================================================================

services:
  redis:
    container_name: redis
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/var/lib/redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - atlas-network

volumes:
  redis-data:

# Network is defined globally in main docker-compose.yml
