  #     - KAFKA_HEAP_OPTS=-Xmx192m
  #   volumes:
  #     - kafka-data:/var/lib/kafka/data
  #   healthcheck:
  #     test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
  #     interval: 10s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 60s
  #   depends_on:
  #     zookeeper:
  #       condition: service_healthy
  #   networks:
  #     - atlas-network

  # Kafka based on KRaft (Current configuration)
  kafka:
    container_name: kafka
    image: confluentinc/cp-kafka:7.9.0
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      # Replace CLUSTER_ID with a unique base64 UUID using "bin/kafka-storage.sh random-uuid"
      # See https://docs.confluent.io/kafka/operations-tools/kafka-tools.html#kafka-storage-sh
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - atlas-network

  # rabbitmq:
  #   container_name: rabbitmq
  #   build:
  #     context: rabbitmq
  #     dockerfile: rabbitmq/Dockerfile
  #   ports:
  #     - "5672:5672"
  #     - "15672:15672"
  #   volumes:
  #     - rabbitmq-data:/var/lib/rabbitmq
  #   healthcheck:
  #     test: ["CMD", "rabbitmq-diagnostics", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 30s
  #   networks:
  #     - atlas-network

  # keycloak:
  #   container_name: keycloak
  #   image: quay.io/keycloak/keycloak:26.2
  #   command: start-dev
  #   ports:
  #     - "8443:8080"
  #   environment:
  #     KEYCLOAK_ADMIN: admin
  #     KEYCLOAK_ADMIN_PASSWORD: admin
  #     KC_DB: dev-file # No external DB needed
  #   volumes:
  #     - keycloak-data:/opt/keycloak/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health/ready || exit 1"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 60s
  #   networks:
  #     - atlas-network

  smtp4dev:
    container_name: smtp4dev
    image: rnwood/smtp4dev
    ports:
      - "5000:80" # Web interface
      - "25:25"   # SMTP server
      - "143:143" # IMAP server
    volumes:
      - smtp4dev-data:/smtp4dev
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 5s
    networks:
      - atlas-network

  # Nginx Reverse Proxy
  nginx:
    container_name: nginx
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      api-gateway:
        condition: service_healthy
      grafana:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      smtp4dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - atlas-network

  # =============================================================================
  # OBSERVABILITY SERVICES
  # =============================================================================
  # Monitoring, logging, tracing, and alerting services for system observability
  # =============================================================================

  # Log Aggregation (Loki)
  loki:
    container_name: loki
    image: grafana/loki:main
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - atlas-network

  # Log Collection Agent (Promtail)
  promtail:
    container_name: promtail
    image: grafana/promtail:main
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./config/promtail/promtail-config.yml:/etc/promtail/config.yml
      - user-service-log:/var/log/user-service
      - product-service-log:/var/log/product-service
      - order-service-log:/var/log/order-service
      - notification-service-log:/var/log/notification-service
      - eureka-server-log:/var/log/eureka-server
      - api-gateway-log:/var/log/api-gateway
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9080/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - atlas-network

  # Metrics Collection (Prometheus)
  prometheus:
    container_name: prometheus
    image: prom/prometheus:main
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus-config.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./config/prometheus/prometheus-config.yml:/etc/prometheus/prometheus-config.yml
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - atlas-network

  # Distributed Tracing (Zipkin)
  zipkin:
    container_name: zipkin
    image: openzipkin/zipkin
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mysql
      - MYSQL_HOST=mysql
      - MYSQL_DB=db_zipkin
      - MYSQL_USER=root
      - MYSQL_PASS=root
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9411/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - atlas-network

  # Visualization and Dashboards (Grafana)
  grafana:
    container_name: grafana
    image: grafana/grafana-oss:main
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel,grafana-clock-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/etc/grafana/dashboards
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks:
      - atlas-network

  # =============================================================================
  # BACKEND SERVICES
  # =============================================================================
  # Core business logic services including microservices and edge services
  # (API Gateway, Service Discovery, etc.)
  # =============================================================================

  # Service Discovery Server (Eureka)
  eureka-server:
    container_name: eureka-server
    image: eureka-server:latest
    build:
      context: ../../../../edge/discovery-server/discovery-server-eureka
    ports:
      - "8761:8761"
    mem_limit: 500m
    cpus: 0.5
    volumes:
      - eureka-server-log:/var/log/eureka-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - atlas-network

  # API Gateway (Spring Cloud Gateway)
  api-gateway:
    container_name: api-gateway
    image: api-gateway:latest
    build:
      context: ../../../../edge/api-gateway/api-gateway-spring-cloud-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_DEFAULT_ZONE=http://eureka-server:8761/eureka
      - JWK_SET_URI=http://user-service:8081/.well-known/jwks.json
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    mem_limit: 1g
    cpus: 0.5
    volumes:
      - api-gateway-log:/var/log/api-gateway
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    networks:
      - atlas-network

  # User Management Service
  user-service:
    container_name: user-service
    image: user-service:latest
    build:
      context: ../../../../application/spring-boot/user-application
    ports:
      - "8081:8081"
    environment:
      - EUREKA_DEFAULT_ZONE=http://eureka-server:8761/eureka
      - MYSQL_URL=jdbc:mysql://mysql:3306/db_user?useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
      - MYSQL_QUARTZ_URL=jdbc:mysql://mysql:3306/db_quartz?useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=root
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    mem_limit: 1g
    cpus: 0.5
    volumes:
      - user-service-log:/var/log/user-service
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    networks:
      - atlas-network

  # Product Catalog Service
  product-service:
    container_name: product-service
    image: product-service:latest
    build:
      context: ../../../../application/spring-boot/product-application
    ports:
      - "8082:8082"
    environment:
      - EUREKA_DEFAULT_ZONE=http://eureka-server:8761/eureka
      - MYSQL_URL=jdbc:mysql://mysql:3306/db_product?useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
      - MYSQL_QUARTZ_URL=jdbc:mysql://mysql:3306/db_quartz?useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=root
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    mem_limit: 1g
    cpus: 0.5
    volumes:
      - product-service-log:/var/log/product-service
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    networks:
      - atlas-network

  # Order Management Service
  order-service:
    container_name: order-service
    image: order-service:latest
    build:
      context: ../../../../application/spring-boot/order-application
    ports:
      - "8083:8083"
    environment:
      - EUREKA_DEFAULT_ZONE=http://eureka-server:8761/eureka
      - GRPC_CLIENT_USER_ADDRESS=static://user-service:50051
      - GRPC_CLIENT_PRODUCT_ADDRESS=static://product-service:50052
      - API_CLIENT_REST_USER_SERVICE_BASE_URL=http://user-service:8081
      - API_CLIENT_REST_PRODUCT_SERVICE_BASE_URL=http://product-service:8082
      - MYSQL_URL=jdbc:mysql://mysql:3306/db_order?useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
      - MYSQL_QUARTZ_URL=jdbc:mysql://mysql:3306/db_quartz?useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=root
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    mem_limit: 1g
    cpus: 0.5
    volumes:
      - order-service-log:/var/log/order-service
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    depends_on:
      eureka-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    networks:
      - atlas-network

  # Notification Service
  notification-service:
    container_name: notification-service
    image: notification-service:latest
    build:
      context: ../../../../application/spring-boot/notification-application
    ports:
      - "8084:8084"
    environment:
      - EUREKA_DEFAULT_ZONE=http://eureka-server:8761/eureka
      - MYSQL_URL=jdbc:mysql://mysql:3306/db_notification?useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
      - MYSQL_QUARTZ_URL=jdbc:mysql://mysql:3306/db_quartz?useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=root
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
      - MAIL_SERVER_HOST=smtp4dev
    mem_limit: 1g
    cpus: 0.5
    volumes:
      - notification-service-log:/var/log/notification-service
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      smtp4dev:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    networks:
      - atlas-network

# =============================================================================
# VOLUMES
# =============================================================================
# Persistent storage volumes for data persistence across container restarts
# =============================================================================

volumes:
  # Infrastructure volumes
  mysql-data:
  redis-data:    
  kafka-data:
  # zookeeper-data:
  # zookeeper-log:
  # rabbitmq-data:
  # keycloak-data:
  smtp4dev-data:
  
  # Backend service log volumes
  eureka-server-log:
  user-service-log:
  product-service-log:
  order-service-log:
  notification-service-log:
  api-gateway-log:
  
  # Observability volumes
  grafana-data:
  prometheus-data:
  
  # Nginx volumes
  nginx-logs:

# =============================================================================
# NETWORKS
# =============================================================================
# Network configuration for service communication
# =============================================================================

networks:
  atlas-network:
    driver: bridge
    name: atlas-network
