# =============================================================================
# Atlas Microservices Platform - Master Compose File
# =============================================================================
# This master compose file orchestrates all services by including individual
# service definitions. Each service is defined in its own YAML file for
# better modularity and maintainability.
# =============================================================================

include:
  # Infrastructure Services
  - services/infrastructure/mysql/mysql.yml
  - services/infrastructure/postgres/postgres.yml
  - services/infrastructure/redis.yml
  - services/infrastructure/kafka.yml
  - services/infrastructure/rabbitmq/rabbitmq.yml
  - services/infrastructure/keycloak.yml
  - services/infrastructure/smtp4dev.yml
  - services/infrastructure/nginx/nginx.yml
  
  # Observability Services
  - services/observability/loki.yml
  - services/observability/promtail/promtail.yml
  - services/observability/prometheus/prometheus.yml
  - services/observability/zipkin.yml
  - services/observability/grafana/grafana.yml
  
  # Backend Services
  - services/application/eureka-server.yml
  - services/application/api-gateway.yml
  - services/application/user-service.yml
  - services/application/product-service.yml
  - services/application/order-service.yml
  - services/application/notification-service.yml

# Global network definition
networks:
  atlas-network:
    driver: bridge
    name: atlas-network
