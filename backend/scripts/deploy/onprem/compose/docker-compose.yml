# =============================================================================
# Atlas Microservices Platform - Unified Docker Compose Configuration
# =============================================================================
# This file contains all services for the Atlas platform organized by category:
# - Infrastructure Services (databases, message queues, etc.)
# - Backend Services (microservices and edge services)
# - Observability Services (monitoring, logging, tracing)
# =============================================================================

services:

  # =============================================================================
  # INFRASTRUCTURE SERVICES
  # =============================================================================
  # Core infrastructure services that provide data persistence, caching,
  # messaging, and other foundational capabilities for the microservices.
  # =============================================================================

  mysql:
    container_name: mysql
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - ./config/mysql:/docker-entrypoint-initdb.d/
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - atlas-network

  redis:
    container_name: redis
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/var/lib/redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - atlas-network

  # zookeeper:
  #   container_name: zookeeper
  #   image: confluentinc/cp-zookeeper:7.0.1
  #   ports:
  #     - "2181:2181"
  #   environment:
  #     - ZOOKEEPER_CLIENT_PORT=2181
