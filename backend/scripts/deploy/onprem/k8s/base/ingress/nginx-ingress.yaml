apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atlas-ingress
  labels:
    app: atlas-ingress
    tier: ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    # Preserve original host header
    nginx.ingress.kubernetes.io/upstream-vhost: $http_host
    # Forward original headers for CORS and proper routing
    nginx.ingress.kubernetes.io/proxy-set-headers: "atlas-proxy-headers"
spec:
  ingressClassName: nginx
  rules:
    - host: api.atlas.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
    - host: grafana.atlas.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
    - host: prometheus.atlas.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
    - host: zipkin.atlas.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zipkin
                port:
                  number: 9411
    - host: mail.atlas.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: smtp4dev
                port:
                  number: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: atlas-proxy-headers
  namespace: atlas-local
  labels:
    app: atlas-ingress
    tier: ingress
data:
  X-Forwarded-Host: $http_host
  X-Forwarded-Proto: $scheme
  X-Real-IP: $remote_addr
  X-Forwarded-For: $proxy_add_x_forwarded_for
  Host: $http_host
