# Promtail Configuration for Kubernetes Log Collection
# Promtail is a log collection agent that ships logs to Loki
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  labels:
    app: promtail
    tier: observability
data:
  config.yml: |
    # Server configuration for Promtail
    server:
      http_listen_port: 9080  # HTTP port for metrics and health checks
      grpc_listen_port: 0     # Disable gRPC server (not needed for this setup)

    # Position file tracks the last read position in log files
    # This prevents re-reading logs after Promtail restarts
    positions:
      filename: /tmp/positions.yaml

    # Loki client configuration - where to send the collected logs
    clients:
      - url: http://loki:3100/loki/api/v1/push  # Loki service endpoint

    # Scrape configurations define how to collect logs
    scrape_configs:
      # Primary job: Collect logs from Kubernetes pods using service discovery
      - job_name: kubernetes-pods
        # Use Kubernetes service discovery to find pods automatically
        kubernetes_sd_configs:
          - role: pod  # Discover all pods in the cluster
        
        # Relabel configs transform Kubernetes metadata into Promtail labels
        relabel_configs:
          # Extract controller name (deployment, statefulset, etc.)
          - source_labels:
              - __meta_kubernetes_pod_controller_name
            regex: .*
            action: replace
            target_label: __tmp_controller_name
          
          # Extract app label from pod metadata
          - source_labels:
              - __meta_kubernetes_pod_label_app
            action: replace
            target_label: __tmp_app
          
          # Extract pod name
          - source_labels:
              - __meta_kubernetes_pod_name
            action: replace
            target_label: __tmp_pod
          
          # Extract namespace
          - source_labels:
              - __meta_kubernetes_namespace
            action: replace
            target_label: __tmp_namespace
          
          # Set final 'app' label from controller name
          - source_labels:
              - __tmp_controller_name
            regex: .*
            action: replace
            target_label: app
          
          # Override 'app' label with pod's app label if available
          - source_labels:
              - __tmp_app
            regex: .*
            action: replace
            target_label: app
          
          # Set 'pod' label
          - source_labels:
              - __tmp_pod
            regex: .*
            action: replace
            target_label: pod
          
          # Set 'namespace' label
          - source_labels:
              - __tmp_namespace
            regex: .*
            action: replace
            target_label: namespace
          
          # Construct the log file path for each container
          # Kubernetes stores container logs in /var/log/pods/<pod_uid>/<container_name>/*.log
          - replacement: /var/log/pods/*$1/*.log
            separator: /
            source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            target_label: __path__
        
        # Pipeline stages process the log content
        pipeline_stages:
          # Parse CRI (Container Runtime Interface) format logs
          # This handles Docker/containerd log formats with timestamps and stream info
          - cri: {}
          # Remove the 'filename' label to reduce cardinality
          - labeldrop:
              - filename

      # Fallback job: Collect any logs not caught by the primary job
      # This is a safety net for containers that might not be discovered properly
      - job_name: containers-fallback
        static_configs:
          - targets:
              - localhost
            labels:
              job: containerlogs
              # Wildcard path to catch all container logs
              __path__: /var/log/pods/*/*/*.log
        
        pipeline_stages:
          # Parse CRI format logs
          - cri: {}
          # Extract metadata from the log file path using regex
          # Path format: /var/log/pods/<namespace>_<pod>_<uid>/<container>/<sequence>.log
          - regex:
              source: filename
              expression: \/var\/log\/pods\/(?P<namespace>[^_]+)_(?P<pod>[^_]+)_(?P<uid>[^\/]+)\/(?P<container>[^\/]+)\/.*\.log
          # Create labels from the extracted metadata
          - labels:
              namespace:
              pod:
              container:
---
# DaemonSet ensures Promtail runs on every node in the cluster
# This is necessary because logs are stored locally on each node
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  labels:
    app: promtail
    tier: observability
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
        tier: observability
    spec:
      # Service account with permissions to read pod metadata
      serviceAccount: promtail
      containers:
        - name: promtail
          # Using the main branch image for latest features
          image: grafana/promtail:main
          args:
            - -config.file=/etc/promtail/config.yml
          env:
            # Make node name available as environment variable
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            # Expose metrics port for Prometheus scraping
            - containerPort: 9080
              name: http-metrics
          
          # Health check: Promtail is ready to accept requests
          livenessProbe:
            httpGet:
              path: /ready
              port: 9080
            initialDelaySeconds: 30  # Wait 30s before first check
            periodSeconds: 10        # Check every 10s
            timeoutSeconds: 5        # 5s timeout per check
            failureThreshold: 5      # Restart after 5 failures
          
          # Readiness check: Promtail is serving metrics
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9080
            initialDelaySeconds: 10  # Wait 10s before first check
            periodSeconds: 15        # Check every 15s
            timeoutSeconds: 5        # 5s timeout per check
            successThreshold: 1      # Ready after 1 success
            failureThreshold: 5      # Not ready after 5 failures
          
          # Resource limits to prevent Promtail from consuming too many resources
          resources:
            requests:
              cpu: "50m"      # Minimum CPU: 0.05 cores
              memory: "64Mi"  # Minimum memory: 64 MiB
            limits:
              cpu: "100m"     # Maximum CPU: 0.1 cores
              memory: "128Mi" # Maximum memory: 128 MiB
          
          volumeMounts:
            # Mount configuration from ConfigMap
            - name: config
              mountPath: /etc/promtail
            # Mount host's /var/log to read container logs
            - name: varlog
              mountPath: /var/log
              readOnly: true  # Read-only access for security
            # Mount Docker container directory (if using Docker runtime)
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true  # Read-only access for security
      
      volumes:
        # Configuration volume from ConfigMap
        - name: config
          configMap:
            name: promtail-config
        # Host path volumes to access log files
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
      
      # Grace period for clean shutdown
      terminationGracePeriodSeconds: 10
---
# Service account for Promtail to access Kubernetes API
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  labels:
    app: promtail
    tier: observability
---
# Cluster role defining permissions needed by Promtail
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
  labels:
    app: promtail
    tier: observability
rules:
  # Permissions to read cluster resources for service discovery
  - apiGroups: [""]
    resources:
      - nodes        # Read node information
      - nodes/proxy  # Access node proxy
      - services     # Read service information
      - endpoints    # Read endpoint information
      - pods         # Read pod information (most important for log collection)
    verbs: ["get", "list", "watch"]  # Read and watch permissions
---
# Bind the cluster role to service accounts across different namespaces
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
  labels:
    app: promtail
    tier: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  # Grant permissions to Promtail service accounts in different environments
  - kind: ServiceAccount
    name: promtail
    namespace: atlas-local  # Local development environment
  - kind: ServiceAccount
    name: promtail
    namespace: atlas-dev    # Development environment
  - kind: ServiceAccount
    name: promtail
    namespace: atlas-stg    # Staging environment
  - kind: ServiceAccount
    name: promtail
    namespace: atlas-prod   # Production environment 
