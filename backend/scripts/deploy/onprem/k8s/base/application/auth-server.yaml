apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-server-logs
  labels:
    app: auth-server
    tier: application
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: hostpath  # Use Docker Desktop default storage class
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-server
  labels:
    app: auth-server
    tier: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-server
  template:
    metadata:
      labels:
        app: auth-server
        tier: application
    spec:
      containers:
        - name: auth-server
          image: auth-server:latest
          imagePullPolicy: Never
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: atlas-config
                  key: SPRING_PROFILES_ACTIVE
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: atlas-config
                  key: LOG_LEVEL
            # Database configuration
            - name: MYSQL_URL
              value: "jdbc:mysql://mysql:3306/db_auth?useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false"
            - name: MYSQL_USERNAME
              value: "root"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-root-password
            # Redis configuration
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            # Observability
            - name: ZIPKIN_ENDPOINT
              value: "http://zipkin:9411/api/v2/spans"
          ports:
            - containerPort: 8091
              name: http
          # Health checks
          # Strategy: Product service takes 3-4 minutes to start successfully
          # Optimized probe configuration for Spring Boot microservice with dependencies (DB, Redis, Kafka)
          # 1. Startup probe: Fast detection of startup completion with exponential backoff-like behavior
          # 2. Readiness probe: Frequent checks for traffic routing decisions  
          # 3. Liveness probe: Conservative monitoring to avoid unnecessary restarts
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8091
              scheme: HTTP
            initialDelaySeconds: 240  # Start 4 minutes after container start (conservative)
            periodSeconds: 45         # Check every 45 seconds (less aggressive)
            timeoutSeconds: 15        # Allow 15 seconds for response (network delays)
            failureThreshold: 10      # Restart only after 10 consecutive failures (7m30s grace)
            successThreshold: 1       # Back to healthy after 1 success
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8091
              scheme: HTTP
            initialDelaySeconds: 180  # Start 3 minutes after container start
            periodSeconds: 5          # Check every 5 seconds (responsive traffic routing)
            timeoutSeconds: 3         # Quick timeout for readiness decisions
            successThreshold: 1       # Ready after 1 success
            failureThreshold: 6       # Remove from service after 6 failures (30s grace)
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8091
              scheme: HTTP
            initialDelaySeconds: 120  # Start checking after 2 minutes
            periodSeconds: 10         # Check every 10 seconds (more responsive)
            timeoutSeconds: 5         # Quick timeout for startup checks
            failureThreshold: 18      # Allow 18 failures = 120s + (10s × 18) = 300s = 5 minutes total
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: auth-server-logs
              mountPath: /var/log/auth-server
      volumes:
        - name: auth-server-logs
          persistentVolumeClaim:
            claimName: auth-server-logs
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: auth-server
  labels:
    app: auth-server
    tier: application
spec:
  selector:
    app: auth-server
  ports:
    - port: 8091
      targetPort: 8091
      name: http
  type: ClusterIP 
