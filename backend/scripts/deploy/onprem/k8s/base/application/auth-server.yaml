apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-server-logs
  labels:
    app: auth-server
    tier: application
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: hostpath  # Use Docker Desktop default storage class
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-server
  labels:
    app: auth-server
    tier: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-server
  template:
    metadata:
      labels:
        app: auth-server
        tier: application
    spec:
      containers:
        - name: auth-server
          image: auth-server:latest
          imagePullPolicy: Never
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: atlas-config
                  key: SPRING_PROFILES_ACTIVE
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: atlas-config
                  key: LOG_LEVEL
            # Database configuration
            - name: MYSQL_URL
              value: "jdbc:mysql://mysql:3306/db_auth?useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false"
            - name: MYSQL_USERNAME
              value: "root"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-root-password
            # Redis configuration
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            # Observability
            - name: ZIPKIN_ENDPOINT
              value: "http://zipkin:9411/api/v2/spans"
          ports:
            - containerPort: 8091
              name: http
          # Health checks
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8091
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8091
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8091
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: auth-server-logs
              mountPath: /var/log/auth-server
      volumes:
        - name: auth-server-logs
          persistentVolumeClaim:
            claimName: auth-server-logs
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: auth-server
  labels:
    app: auth-server
    tier: application
spec:
  selector:
    app: auth-server
  ports:
    - port: 8091
      targetPort: 8091
      name: http
  type: ClusterIP 
