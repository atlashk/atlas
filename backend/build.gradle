import org.yaml.snakeyaml.Yaml

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.yaml:snakeyaml:2.5'
    }
}

// Load app stack configs
def loadAppStack() {
    def appStackName = project.findProperty('appStack') ?: 'local.dev'
    File appStackFile = new File(rootDir, "app-stack/config/app-stack.${appStackName}.yml")
    if (!appStackFile.exists()) {
        throw new GradleException("App stack config file not found: ${appStackFile.absolutePath}")
    }

    // Parse YAML file
    def yaml = new Yaml()
    def appStack = [:]
    try {
        appStackFile.withInputStream { inputStream ->
            def yamlData = yaml.load(inputStream)
            if (yamlData instanceof Map) {
                // Flatten nested structure to maintain compatibility with existing code
                appStack = flattenMap(yamlData)
            } else {
                throw new GradleException("Invalid YAML structure in ${appStackFile.name}: expected a map")
            }
        }
    } catch (Exception e) {
        throw new GradleException("Failed to parse YAML file ${appStackFile.name}: ${e.message}")
    }

    return appStack
}

// Helper function to flatten nested maps with dot notation
static Map<String, Object> flattenMap(Map<?, ?> map, String prefix = '') {
    Map<String, Object> result = [:]

    if (!map) {
        return result
    }

    map.each { k, v ->
        String key = k.toString()
        String newKey = prefix ? "${prefix}.${key}" : key

        if (v instanceof Map) {
            result.putAll(flattenMap((Map) v, newKey))
        } else {
            result[newKey] = v
        }
    }

    return result
}

ext {
    // Plugins
    set('springBootPluginVersion', '4.0.4')
    set('springDependencyManagementPluginVersion', '1.1.7')

    set('springCloudVersion', '2025.1.0')
    set('springAiVersion', "2.0.0-M3")
    set('springGrpcVersion', "1.0.2")

    set('lombokVersion', '1.18.38')
    set('mapstructVersion', '1.6.3')
    set('junitVersion', '5.10.0')

    appStack = loadAppStack()
}
