// Load app stack configs
def loadAppStack() {
    def appStackFileName = project.findProperty('appStackFile') ?: System.getProperty('appStackFile')
    def appStackFile = appStackFileName ? new File(rootDir, appStackFileName) : new File(rootDir, "app-stack.cfg")
    if (!appStackFile.exists()) {
        throw new GradleException("App stack config file not found: ${appStackFile.absolutePath}")
    }

    def appStack = [:]
    appStackFile.eachLine('UTF-8') { line ->
        line = line.trim()
        if (line && !line.startsWith('#')) {
            def parts = line.split('=', 2).collect { it.trim() }
            if (parts.size() == 2 && parts[1]) {
                appStack[parts[0]] = parts[1]
            } else {
                throw new GradleException("Invalid line in ${appStackFile.name}: '${line}'")
            }
        }
    }
    return appStack
}

ext {
    // Plugins
    set('springBootPluginVersion', '3.5.4')
    set('springDependencyManagementPluginVersion', '1.1.7')

    set('springFrameworkVersion', '6.2.9')
    set('springCloudVersion', '2025.0.0')
    set('awsSdkVersion', '2.29.33')
    set('lombokVersion', '1.18.38')
    set('junitVersion', '5.10.0')

    appStack = loadAppStack()
}
