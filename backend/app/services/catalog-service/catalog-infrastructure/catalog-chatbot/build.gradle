plugins {
    id 'java-library'
    id 'org.springframework.boot' version "${springBootPluginVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementPluginVersion}"
    id 'idea'
}

group = 'org.atlas'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Port
    api project(':services.catalog.port')

    // RAG
    api 'org.springframework.ai:spring-ai-advisors-vector-store'

    // Chat & embedding models
    api 'org.springframework.ai:spring-ai-starter-model-ollama'
    api 'org.springframework.ai:spring-ai-starter-model-openai'

    // Chat memory
    api 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-jdbc'

    // Vector Store
    api 'org.springframework.ai:spring-ai-starter-vector-store-qdrant'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Mapstruct
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

bootJar {
    enabled = false
}

jar {
    enabled = true
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}
