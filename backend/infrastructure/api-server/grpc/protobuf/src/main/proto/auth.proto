syntax = "proto3";

option java_multiple_files = true;
option java_package = "org.atlas.infrastructure.api.server.grpc.protobuf.auth";

import "google/protobuf/empty.proto";

package auth;

service UserService {
  rpc CreateUser (CreateUserRequestProto) returns (google.protobuf.Empty) {};
}

message CreateUserRequestProto {
  int32 user_id = 1;
  string username = 2;
  string password = 3;
  string email = 4;
  string phone_number = 5;
  string role = 6;
}
