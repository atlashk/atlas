spring:
  lifecycle:
    # Graceful shutdown config
    # This timeout must not exceed terminationGracePeriodSeconds of K8s Pod
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      max-file-size: 10MB         # Limit for each uploaded file
      max-request-size: 20MB      # Allow multiple files, so set slightly higher
      file-size-threshold: 2MB    # Write to disk if file exceeds this size
      location: ${java.io.tmpdir} # Use system temp directory

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    default-models-expand-depth: -1 # Hide Schemas section
  use-fqn: true # Fix for static nested class
#  packages-to-scan: org.atlas.service.user.impl.api.server.rest
