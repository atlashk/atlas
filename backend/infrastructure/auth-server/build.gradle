plugins {
    id 'java-library'
    id 'org.springframework.boot' version "${springBootPluginVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementPluginVersion}"
    id 'idea'
}

group = 'org.atlas'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Framework
    api project(':framework')

    // Lib
    api 'org.springframework.boot:spring-boot-starter-security'

    // Domain
    api project(':domain.user')

    // Infrastructure
    api project(':infrastructure.api-server.rest.core')
    api project(':infrastructure.bootstrap')
    switch (rootProject.ext.appStack['cache']) {
        case 'simple':
            api project(':infrastructure.cache.simple')
            break
        case 'redis':
            api project(':infrastructure.cache.redis')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['cache']}")
    }
    switch (rootProject.ext.appStack['redis']) {
        case 'standalone':
            api project(':infrastructure.redis.standalone')
            break
        case 'cluster':
            api project(':infrastructure.redis.cluster')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['redis']}")
    }

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

bootJar {
    enabled = false
}

jar {
    enabled = true
}

test {
    useJUnitPlatform()
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}
