plugins {
    id 'java-library'
    id 'org.springframework.boot' version "${springBootPluginVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementPluginVersion}"
    id 'idea'
}

group = 'org.atlas'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Framework
    api project(':framework')

    // Infrastructure
    switch (rootProject.ext.appStack['redis']) {
        case 'standalone':
            api project(':infrastructure.kv-store.redis.connector.standalone')
            break
        case 'cluster':
            api project(':infrastructure.kv-store.redis.connector.cluster')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['redis']}")
    }
    api project(':infrastructure.kv-store.redis.ops')

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

bootJar {
    enabled = false
}

jar {
    enabled = true
}

test {
    useJUnitPlatform()
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}
