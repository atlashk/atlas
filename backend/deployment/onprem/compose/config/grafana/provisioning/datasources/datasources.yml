apiVersion: 1

datasources:
  # Prometheus for metrics
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: DS_PROMETHEUS
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 5s
      queryTimeout: 60s
      httpMethod: POST
    secureJsonData: {}

  # Loki for logs
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: DS_LOKI
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: DS_ZIPKIN
          matcherRegex: "traceID=(\\w+)"
          name: TraceID
          url: "$${__value.raw}"
    secureJsonData: {}

  # Zipkin for distributed tracing
  - name: Zipkin
    type: zipkin
    access: proxy
    url: http://zipkin:9411
    uid: DS_ZIPKIN
    editable: true
    jsonData:
      nodeGraph:
        enabled: true
    secureJsonData: {}
