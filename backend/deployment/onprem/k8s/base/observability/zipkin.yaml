apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  labels:
    app: zipkin
    tier: infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zipkin
  template:
    metadata:
      labels:
        app: zipkin
        tier: infrastructure
    spec:
      initContainers:
        - name: wait-for-mysql
          image: mysql:8.0
          command:
            - /bin/sh
            - -c
            - |
              until mysqladmin ping -h mysql -P 3306 -u root -p"$MYSQL_ROOT_PASSWORD" --silent; do
                echo "Waiting for MySQL to be ready..."
                sleep 5
              done
              echo "MySQL is ready!"
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-root-password
      containers:
        - name: zipkin
          image: openzipkin/zipkin
          env:
            - name: STORAGE_TYPE
              value: "mysql"
            - name: MYSQL_HOST
              value: "mysql"
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DB
              value: "db_zipkin"
            - name: MYSQL_USER
              value: "root"
            - name: MYSQL_PASS
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-root-password
            - name: MYSQL_TCP_KEEP_ALIVE
              value: "true"
            - name: MYSQL_MAX_CONNECTIONS
              value: "10"
          ports:
            - containerPort: 9411
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: 9411
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 9411
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: zipkin
  labels:
    app: zipkin
    tier: infrastructure
spec:
  selector:
    app: zipkin
  ports:
    - port: 9411
      targetPort: 9411
      name: http
  type: ClusterIP 
