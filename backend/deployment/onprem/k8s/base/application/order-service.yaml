apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: order-service-logs
  labels:
    app: order-service
    tier: application
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: hostpath  # Use Docker Desktop default storage class
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
    tier: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        tier: application
    spec:
      containers:
        - name: order-service
          image: order-service:latest
          imagePullPolicy: Never
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: atlas-${ENVIRONMENT}-config
                  key: SPRING_PROFILES_ACTIVE
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: atlas-${ENVIRONMENT}-config
                  key: LOG_LEVEL
            # Database configuration
            - name: MYSQL_URL
              value: "jdbc:mysql://mysql:3306/db_order?useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false"
            - name: MYSQL_USERNAME
              value: "root"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-root-password
            - name: MYSQL_QUARTZ_URL
              value: "jdbc:mysql://mysql:3306/db_quartz?useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false"
            # Redis configuration
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            # Kafka configuration
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:29092"
            # GRPC Client configuration
            - name: GRPC_CLIENT_USER_ADDRESS
              value: "static://user-service:50051"
            - name: GRPC_CLIENT_PRODUCT_ADDRESS
              value: "static://product-service:50052"
            # REST API Client configuration
            - name: API_CLIENT_REST_USER_SERVICE_BASE_URL
              value: "http://user-service:8081"
            - name: API_CLIENT_REST_PRODUCT_SERVICE_BASE_URL
              value: "http://product-service:8082"
            # Observability
            - name: ZIPKIN_ENDPOINT
              value: "http://zipkin:9411/api/v2/spans"
          ports:
            - containerPort: 8083
              name: http
          # Health checks
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12  # Order service may take longer due to dependencies
          # Resource optimization
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: order-service-logs
              mountPath: /var/log/order-service
      volumes:
        - name: order-service-logs
          persistentVolumeClaim:
            claimName: order-service-logs
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    app: order-service
    tier: application
spec:
  selector:
    app: order-service
  ports:
    - port: 8083
      targetPort: 8083
      name: http
  type: ClusterIP 
