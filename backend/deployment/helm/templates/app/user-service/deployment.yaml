apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ lower $.Release.Name }}-user-service
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/instance: {{ lower $.Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.global.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: user-service
      app.kubernetes.io/instance: {{ lower $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-service
        app.kubernetes.io/instance: {{ lower $.Release.Name }}
    spec:
      {{- with .Values.nodeGroups.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeGroups.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ lower $.Release.Name }}-{{ .Values.global.serviceAccount.name }}
      {{- $deps := list -}}
      {{- if eq .Values.appStack.datasource "mysql" -}}
      {{- $deps = append $deps (dict "name" "mysql" "host" (printf "%s-mysql" (lower $.Release.Name)) "port" .Values.mysql.service.ports.mysql) -}}
      {{- end -}}
      {{- if eq .Values.appStack.datasource "postgres" -}}
      {{- $deps = append $deps (dict "name" "postgres" "host" (printf "%s-postgres" (lower $.Release.Name)) "port" .Values.postgres.service.ports.postgres) -}}
      {{- end -}}
      {{- if eq .Values.appStack.idp "keycloak" -}}
      {{- $deps = append $deps (dict "name" "keycloak" "host" (printf "%s-keycloak" (lower $.Release.Name)) "port" .Values.keycloak.service.ports.http) -}}
      {{- end -}}
      {{- include "atlas.waitFor.initContainers" (dict "deps" $deps) | nindent 6 }}
      containers:
        - name: user-service
          image: "{{ if .Values.global.image.registry -}}{{ .Values.global.image.registry }}/{{ end -}}{{ .Release.Namespace }}/{{ .Values.userSvc.image.repository }}:{{ .Values.userSvc.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.userSvc.service.ports.http }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.global.springProfilesActive | quote }}
            {{- if eq .Values.appStack.datasource "mysql" }}
            - name: DB_URL
              value: "jdbc:mysql://{{ lower $.Release.Name }}-mysql:{{ .Values.mysql.service.ports.mysql }}/db_user?useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ lower $.Release.Name }}-mysql
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ lower $.Release.Name }}-mysql
                  key: password
            {{- end }}
            {{- if eq .Values.appStack.datasource "postgres" }}
            - name: DB_URL
              value: "jdbc:postgresql://postgres:{{ .Values.postgres.service.ports.postgres }}/db_user"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ lower $.Release.Name }}-postgres
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ lower $.Release.Name }}-postgres
                  key: password
            {{- end }}
            {{- if eq .Values.appStack.idp "keycloak" }}
            - name: KEYCLOAK_BASE_URL
              value: "http://{{ lower $.Release.Name }}-keycloak:{{ .Values.keycloak.service.ports.http }}"
            - name: KEYCLOAK_REALM
              valueFrom:
                configMapKeyRef:
                  name: {{ lower $.Release.Name }}-keycloak-config
                  key: keycloak-realm
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ lower $.Release.Name }}-keycloak-config
                  key: keycloak-admin-client-id
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                configMapKeyRef:
                  name: {{ lower $.Release.Name }}-keycloak-config
                  key: keycloak-admin-client-secret
            {{- end }}
            {{- if eq .Values.appStack.observability.tracing "zipkin" }}
            - name: ZIPKIN_ENDPOINT
              value: "http://{{ lower $.Release.Name }}-zipkin:{{ .Values.zipkin.service.ports.http }}/api/v2/spans"
            {{- end }}
            {{- if eq .Values.appStack.observability.tracing "tempo" }}
            - name: OTEL_COLLECTOR_TRACES_ENDPOINT
              value: "http://{{ lower $.Release.Name }}-otel-collector:{{ .Values.otelCollector.service.ports.otlpHttp }}/v1/traces"
            {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{ toYaml .Values.userSvc.resources | nindent 12 }}
          volumeMounts:
            - name: user-service-logs
              mountPath: /var/log/user-service
      volumes:
        - name: user-service-logs
          emptyDir: {} # Log volume changed to emptyDir for Promtail compatibility
      terminationGracePeriodSeconds: 30
