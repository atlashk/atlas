{{- if .Values.apiGateway.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ lower $.Release.Name }}-api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/instance: {{ lower $.Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
  annotations:
    # Route directly to api-gateway Pod IPs — no NodePort hop.
    alb.ingress.kubernetes.io/target-type: ip
    # Public or VPC-internal ALB
    alb.ingress.kubernetes.io/scheme: {{ .Values.apiGateway.ingress.alb.scheme }}
    {{- if .Values.apiGateway.ingress.alb.certificateArn }}
    # HTTPS enabled: listen on both 80 and 443, redirect HTTP → HTTPS (301)
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80},{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.apiGateway.ingress.alb.certificateArn | quote }}
    {{- else }}
    # No certificate: HTTP-only on port 80
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    {{- end }}
    {{- with .Values.apiGateway.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # Handled by the AWS Load Balancer Controller (installed via Terraform).
  ingressClassName: alb
  rules:
    - {{- if and .Values.apiGateway.ingress.host (ne .Values.apiGateway.ingress.host "") }}
      host: {{ .Values.apiGateway.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ lower $.Release.Name }}-api-gateway
                port:
                  number: {{ .Values.apiGateway.service.ports.http }}
{{- end }}
