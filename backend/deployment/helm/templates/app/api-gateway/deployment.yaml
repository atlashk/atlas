apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ lower $.Release.Name }}-api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/instance: {{ lower $.Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.global.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
      app.kubernetes.io/instance: {{ lower $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/instance: {{ lower $.Release.Name }}
    spec:
      {{- with .Values.nodeGroups.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeGroups.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ lower $.Release.Name }}-{{ .Values.global.serviceAccount.name }}
      containers:
        - name: api-gateway
          image: "{{ if .Values.global.image.registry -}}{{ .Values.global.image.registry }}/{{ end -}}{{ .Values.apiGateway.image.repository }}:{{ .Values.apiGateway.image.tag }}"
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.global.springProfilesActive | quote }}
            - name: USER_SERVICE_URI
              value: "http://{{ lower $.Release.Name }}-user-service:{{ .Values.userSvc.service.ports.http }}"
            - name: CATALOG_SERVICE_URI
              value: "http://{{ lower $.Release.Name }}-catalog-service:{{ .Values.catalogSvc.service.ports.http }}"
            - name: INVENTORY_SERVICE_URI
              value: "http://{{ lower $.Release.Name }}-inventory-service:{{ .Values.inventorySvc.service.ports.http }}"
            - name: ORDER_SERVICE_URI
              value: "http://{{ lower $.Release.Name }}-order-service:{{ .Values.orderSvc.service.ports.http }}"
            - name: PAYMENT_SERVICE_URI
              value: "http://{{ lower $.Release.Name }}-payment-service:{{ .Values.paymentSvc.service.ports.http }}"
            {{- if eq .Values.appStack.kvStore "redis" }}
            - name: REDIS_HOST
              value: "{{ lower $.Release.Name }}-redis"
            - name: REDIS_PORT
              value: {{ .Values.redis.service.ports.redis | quote }}
            {{- end }}
            {{- if eq .Values.appStack.idp "spring" }}
            - name: JWK_SET_URI
              value: "http://{{ lower $.Release.Name }}-authorization-server:{{ .Values.authorizationServer.service.ports.http }}/.well-known/jwks.json"
            {{- end }}
            {{- if eq .Values.appStack.idp "keycloak" }}
            - name: JWK_SET_URI
              value: "http://{{ lower $.Release.Name }}-keycloak:{{ .Values.keycloak.service.ports.http }}/realms/{{ .Values.keycloak.config.realm }}/protocol/openid-connect/certs"
            {{- end }}
            {{- if eq .Values.appStack.observability.tracing "zipkin" }}
            - name: ZIPKIN_ENDPOINT
              value: "http://{{ lower $.Release.Name }}-zipkin:{{ .Values.zipkin.service.ports.http }}/api/v2/spans"
            {{- end }}
            {{- if eq .Values.appStack.observability.tracing "tempo" }}
            - name: OTEL_COLLECTOR_TRACES_ENDPOINT
              value: "http://{{ lower $.Release.Name }}-otel-collector:{{ .Values.otelCollector.service.ports.otlpHttp }}/v1/traces"
            {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{ toYaml .Values.apiGateway.resources | nindent 12 }}
          volumeMounts:
            - name: api-gateway-logs
              mountPath: /var/log/api-gateway
      volumes:
        - name: api-gateway-logs
          emptyDir: {} # Log volume changed to emptyDir for Promtail compatibility
      terminationGracePeriodSeconds: 30
