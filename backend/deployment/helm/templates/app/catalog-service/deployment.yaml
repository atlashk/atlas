apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ lower $.Release.Name }}-catalog-service
  labels:
    app.kubernetes.io/name: catalog-service
    app.kubernetes.io/instance: {{ lower $.Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.global.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-service
      app.kubernetes.io/instance: {{ lower $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-service
        app.kubernetes.io/instance: {{ lower $.Release.Name }}
    spec:
      {{- with .Values.nodeGroups.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeGroups.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ lower $.Release.Name }}-{{ .Values.global.serviceAccount.name }}
      {{- $deps := list -}}
      {{- if eq .Values.appStack.datasource "mysql" -}}
      {{- $deps = append $deps (dict "name" "mysql" "host" (printf "%s-mysql" (lower $.Release.Name)) "port" .Values.mysql.service.ports.mysql) -}}
      {{- end -}}
      {{- if eq .Values.appStack.datasource "postgres" -}}
      {{- $deps = append $deps (dict "name" "postgres" "host" (printf "%s-postgres" (lower $.Release.Name)) "port" .Values.postgres.service.ports.postgres) -}}
      {{- end -}}
      {{- if eq .Values.appStack.search "elasticsearch" -}}
      {{- $deps = append $deps (dict "name" "elasticsearch" "host" (printf "%s-elasticsearch" (lower $.Release.Name)) "port" .Values.elasticsearch.service.ports.http) -}}
      {{- end -}}
      {{- include "atlas.waitFor.initContainers" (dict "deps" $deps) | nindent 6 }}
      containers:
        - name: catalog-service
          image: "{{ if .Values.global.image.registry -}}{{ .Values.global.image.registry }}/{{ end -}}{{ .Values.catalogSvc.image.repository }}:{{ .Values.catalogSvc.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.catalogSvc.service.ports.http }}
            {{- if eq .Values.appStack.internal "grpc" }}
            - name: grpc
              containerPort: {{ .Values.catalogSvc.service.ports.grpc }}
            {{- end }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.global.springProfilesActive | quote }}
            {{- if eq .Values.appStack.datasource "mysql" }}
            - name: DB_URL
              value: "jdbc:mysql://{{ lower $.Release.Name }}-mysql:{{ .Values.mysql.service.ports.mysql }}/db_catalog?useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ lower $.Release.Name }}-mysql
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ lower $.Release.Name }}-mysql
                  key: password
            {{- end }}
            {{- if eq .Values.appStack.datasource "postgres" }}
            - name: DB_URL
              value: "jdbc:postgresql://{{ lower $.Release.Name }}-postgres:{{ .Values.postgres.service.ports.postgres }}/db_catalog"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ lower $.Release.Name }}-postgres
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ lower $.Release.Name }}-postgres
                  key: password
            {{- end }}
            {{- if eq .Values.appStack.kvStore "redis" }}
            - name: REDIS_HOST
              value: "{{ lower $.Release.Name }}-redis"
            - name: REDIS_PORT
              value: {{ .Values.redis.service.ports.redis | quote }}
            {{- end }}
            {{- if eq .Values.appStack.messaging "kafka" }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "{{ lower $.Release.Name }}-kafka:{{ .Values.kafka.service.ports.kafkaInternal }}"
            {{- end }}
            {{- if eq .Values.appStack.messaging "rabbitmq" }}
            - name: RABBITMQ_HOST
              value: "{{ lower $.Release.Name }}-rabbitmq"
            - name: RABBITMQ_PORT
              value: {{ .Values.rabbitmq.service.ports.amqp | quote }}
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ lower $.Release.Name }}-rabbitmq
                  key: user
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ lower $.Release.Name }}-rabbitmq
                  key: password
            {{- end }}
            {{- if eq .Values.appStack.search "elasticsearch" }}
            - name: ELASTICSEARCH_HOST
              value: "{{ lower $.Release.Name }}-elasticsearch"
            - name: ELASTICSEARCH_PORT
              value: {{ .Values.elasticsearch.service.ports.http | quote }}
            - name: ELASTICSEARCH_USERNAME
              value: "elastic"
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ lower $.Release.Name }}-elasticsearch
                  key: password
            {{- end }}
            {{- if eq .Values.appStack.storage "minio" }}
            - name: MINIO_ENDPOINT
              value: "http://{{ lower $.Release.Name }}-minio:{{ .Values.minio.service.ports.s3 }}"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ lower $.Release.Name }}-minio
                  key: root-user
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ lower $.Release.Name }}-minio
                  key: root-password
            {{- end }}
            {{- if eq .Values.appStack.observability.tracing "zipkin" }}
            - name: ZIPKIN_ENDPOINT
              value: "http://{{ lower $.Release.Name }}-zipkin:{{ .Values.zipkin.service.ports.http }}/api/v2/spans"
            {{- end }}
            {{- if eq .Values.appStack.observability.tracing "tempo" }}
            - name: OTEL_COLLECTOR_TRACES_ENDPOINT
              value: "http://{{ lower $.Release.Name }}-otel-collector:{{ .Values.otelCollector.service.ports.otlpHttp }}/v1/traces"
            {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{ toYaml .Values.catalogSvc.resources | nindent 12 }}
          volumeMounts:
            - name: catalog-service-logs
              mountPath: /var/log/catalog-service
      volumes:
        - name: catalog-service-logs
          emptyDir: {} # Log volume changed to emptyDir for Promtail compatibility
      terminationGracePeriodSeconds: 30
