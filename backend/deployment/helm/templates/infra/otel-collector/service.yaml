{{- if eq .Values.appStack.observability.tracing "tempo" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ lower $.Release.Name }}-otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: {{ lower $.Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  selector:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: {{ lower $.Release.Name }}
  ports:
    - name: otlp-grpc
      port: {{ .Values.otelCollector.service.ports.otlpGrpc }}
      targetPort: 4317
    - name: otlp-http
      port: {{ .Values.otelCollector.service.ports.otlpHttp }}
      targetPort: 4318
    - name: health
      port: {{ .Values.otelCollector.service.ports.health }}
      targetPort: 13133
{{- end }}
