management:
  endpoints:
    web:
      exposure:
        # Spring Cloud Gateway: gateway,refresh,routes
        # curl -X GET http://<gateway-host>:<port>/actuator/gateway/routes
        # curl -X POST http://<gateway-host>:<port>/actuator/gateway/refresh
        include: health,info,prometheus,gateway,refresh,routes
  endpoint:
    gateway:
      access: unrestricted

server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@userRateLimiter}"
                key-resolver: "#{@userKeyResolver}"
          httpclient:
            connect-timeout: 30000  # Connection timeout in milliseconds
            response-timeout: 5m # Response timeout in ISO-8601 format or duration
            pool:
              max-idle-time: 45m # Allow connections to stay idle longer for SSE/WebSocket
          routes:
            # User service
            - id: user-service-common
              uri: ${USER_SERVICE_URI:lb://user-service}
              predicates:
                - Path=/api/common/users/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
                - SessionValidation
                - TokenRelay
            - id: user-service-admin
              uri: ${USER_SERVICE_URI:lb://user-service}
              predicates:
                - Path=/api/admin/users/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
                - SessionValidation
                - TokenRelay
            - id: user-service-front
              uri: ${USER_SERVICE_URI:lb://user-service}
              predicates:
                - Path=/api/front/users/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
                - SessionValidation
                - TokenRelay
            - id: user-service-authorized-auth
              uri: ${USER_SERVICE_URI:lb://user-service}
              predicates:
                - Path=/api/auth/logout
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
                - SessionValidation
                - TokenRelay
            - id: user-service-unauthorized-auth
              uri: ${USER_SERVICE_URI:lb://user-service}
              predicates:
                - Path=/api/auth/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - id: user-service-api-docs
              uri: ${USER_SERVICE_URI:lb://user-service}
              predicates:
                - Path=/api-docs/user-service
              filters:
                - RewritePath=/api-docs/user-service, /api-docs
            # Product service
            - id: product-service-admin
              uri: ${PRODUCT_SERVICE_URI:lb://product-service}
              predicates:
                - Path=/api/admin/products/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
                - SessionValidation
                - TokenRelay
            - id: product-service-front
              uri: ${PRODUCT_SERVICE_URI:lb://product-service}
              predicates:
                - Path=/api/front/products/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - id: product-service-common
              uri: ${PRODUCT_SERVICE_URI:lb://product-service}
              predicates:
                - Path=/api/common/products/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - id: product-service-api-docs
              uri: ${PRODUCT_SERVICE_URI:lb://product-service}
              predicates:
                - Path=/api-docs/product-service
              filters:
                - RewritePath=/api-docs/product-service, /api-docs
            # Order service
            - id: order-service-admin
              uri: ${ORDER_SERVICE_URI:lb://order-service}
              predicates:
                - Path=/api/admin/orders/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
                - SessionValidation
                - TokenRelay
            - id: order-service-front
              uri: ${ORDER_SERVICE_URI:lb://order-service}
              predicates:
                - Path=/api/front/orders/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
                - SessionValidation
                - TokenRelay
            - id: order-service-api-docs
              uri: ${ORDER_SERVICE_URI:lb://order-service}
              predicates:
                - Path=/api-docs/order-service
              filters:
                - RewritePath=/api-docs/order-service, /api-docs
            # Notification service
            - id: notification-service-sse
              uri: ${NOTIFICATION_SERVICE_URI:lb://notification-service}
              predicates:
                - Path=/notification/sse/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - id: notification-service-websocket
              uri: ${NOTIFICATION_SERVICE_URI:lb://notification-service}
              predicates:
                - Path=/notification/ws/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
  reactor:
    context-propagation: auto # Enable tracing
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: User Service
        url: /api-docs/user-service
      - name: Product Service
        url: /api-docs/product-service
      - name: Order Service
        url: /api-docs/order-service
    default-models-expand-depth: -1 # Hide Schemas section

app:
  api-gateway:
    auth-rules:
      non-secured-paths:
        - "/actuator/**"
        - "/api/auth/login"
        - "/api/auth/refresh-token"
        - "/api/auth/ott/generate"
        - "/api/auth/ott/login"
        - "/api/front/users/register"
        - "/api/common/products/**"
        - "/api/front/products/**"
        - "/notification/**"
        - "/api-docs/**"
        - "/swagger-ui/**"
      secured-paths:
        - path: "/api/auth/logout"
          roles: [ "USER", "ADMIN" ]
        - path: "/api/common/**"
          roles: [ "USER", "ADMIN" ]
        - path: "/api/front/**"
          roles: [ "USER" ]
        - path: "/api/admin/**"
          roles: [ "ADMIN" ]
