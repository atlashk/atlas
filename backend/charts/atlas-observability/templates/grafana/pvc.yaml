{{- if eq (include "hasGrafana" .) "true" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ lower $.Release.Name }}-grafana-data
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ lower $.Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.global.persistence.storageClass }}
  storageClassName: {{ .Values.global.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: 2Gi
{{- end }}
