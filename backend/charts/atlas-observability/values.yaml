global:
  replicaCount: 1

  persistence:
    storageClass: ""

  service:
    type: ClusterIP

  secret:
    username: &defaultUsername YXRsYXM=
    password: &defaultPassword QXRsYXNAMTIzNDU2

# Node Group scheduling
# --------------------------------------------------------------------------------------------------
nodeGroups:
  infra:
    nodeSelector:
      role: infra
    tolerations:
      - key: dedicated
        operator: Equal
        value: infra
        effect: NoSchedule

# App stack config — controls which observability components are deployed
# --------------------------------------------------------------------------------------------------
appStack:
  observability:
    logging:
      stack: loki
    metrics: prometheus
    tracing: tempo
  idp: spring

# --------------------------------------------------------------------------------------------------
# Reference to the atlas-app release name so prometheus scrape configs can
# construct correct service URLs for app services.
# Set this to the Helm release name you use when installing atlas-app.
# --------------------------------------------------------------------------------------------------
appReleaseName: "atlas-app"

# Observability service configurations
# --------------------------------------------------------------------------------------------------

grafana:
  image:
    repository: grafana/grafana-oss
    tag: main
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  secrets:
    adminUser: *defaultUsername
    adminPassword: *defaultPassword
  service:
    ports:
      http: 3000

loki:
  image:
    repository: grafana/loki
    tag: main
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    ports:
      http: 3100

otelCollector:
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: latest
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  service:
    ports:
      otlpGrpc: 4317
      otlpHttp: 4318
      health: 13133

prometheus:
  image:
    repository: prom/prometheus
    tag: main
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    ports:
      http: 9090

promtail:
  image:
    repository: grafana/promtail
    tag: main
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  serviceAccount: promtail

tempo:
  image:
    repository: grafana/tempo
    tag: 2.9.1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    ports:
      http: 3200
      grpc: 9095
      otlpGrpc: 4317
      otlpHttp: 4318

zipkin:
  image:
    repository: openzipkin/zipkin
    tag: latest
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    ports:
      http: 9411
