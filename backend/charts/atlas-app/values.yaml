global:
  replicaCount: 1

  image:
    registry: ""
    repository: ""
    pullPolicy: Never
    tag: latest

  imagePullSecrets: []

  service:
    type: ClusterIP

  podAnnotations: {}
  podLabels: {}

  podSecurityContext: {}

  securityContext: {}

  springProfilesActive: dev

# Node Group scheduling
# --------------------------------------------------------------------------------------------------
nodeGroups:
  app:
    nodeSelector:
      role: app
    tolerations: []

# --------------------------------------------------------------------------------------------------
# Reference names for the other charts.
# Set these to the Helm release names used when installing each chart.
# --------------------------------------------------------------------------------------------------

# Release name of the atlas-common chart — used to locate the ServiceAccount.
commonReleaseName: "atlas-common"

# Release name of the atlas-data chart — used to construct data service hostnames
# (mysql, postgres, redis, kafka, rabbitmq, elasticsearch, keycloak, minio, qdrant, smtp4dev).
dataReleaseName: "atlas-data"

# Release name of the atlas-observability chart — used to construct observability hostnames
# (zipkin, otel-collector, tempo, loki, prometheus, grafana).
observabilityReleaseName: "atlas-observability"

# App stack config — must match the settings in atlas-infra/values.yaml
# --------------------------------------------------------------------------------------------------
appStack:
  ai:
    vectorstore:
      qdrant: false
  datasource: mysql
  file:
    csv: opencsv
    excel: poi
    pdf: pdfbox
  search: elasticsearch
  idp: spring
  internal: rest
  kvStore: redis
  messaging: kafka
  migration: flyway
  notification:
    email: spring
  observability:
    logging:
      stack: loki
      framework: logback
    metrics: prometheus
    tracing: tempo
  persistence: jpa
  redis: standalone
  scheduler: quartz
  serviceDiscovery: kubernetes
  storage: minio
  template: freemarker

# Data-layer port references (must match atlas-data/values.yaml)
# --------------------------------------------------------------------------------------------------
mysql:
  service:
    ports:
      mysql: 3306

postgres:
  service:
    ports:
      postgres: 5432

redis:
  service:
    ports:
      redis: 6379

kafka:
  service:
    ports:
      kafkaInternal: 29092

rabbitmq:
  service:
    ports:
      amqp: 5672

elasticsearch:
  service:
    ports:
      http: 9200

keycloak:
  config:
    realm: default
  service:
    ports:
      http: 8080

minio:
  service:
    ports:
      s3: 9000

# Observability port references (must match atlas-observability/values.yaml)
# --------------------------------------------------------------------------------------------------
zipkin:
  service:
    ports:
      http: 9411

otelCollector:
  service:
    ports:
      otlpHttp: 4318

tempo:
  service:
    ports:
      otlpGrpc: 4317

# App services
# --------------------------------------------------------------------------------------------------

userSvc:
  image:
    repository: user-service
    tag: ""   # leave empty to inherit global.image.tag
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  service:
    ports:
      http: 8081
  extraEnv: []

catalogSvc:
  image:
    repository: catalog-service
    tag: ""   # leave empty to inherit global.image.tag
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  service:
    ports:
      http: 8082
      grpc: 50052
  extraEnv: []

inventorySvc:
  image:
    repository: inventory-service
    tag: ""   # leave empty to inherit global.image.tag
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  service:
    ports:
      http: 8083
  extraEnv: []

orderSvc:
  image:
    repository: order-service
    tag: ""   # leave empty to inherit global.image.tag
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  service:
    ports:
      http: 8084
  extraEnv: []

paymentSvc:
  image:
    repository: payment-service
    tag: ""   # leave empty to inherit global.image.tag
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  service:
    ports:
      http: 8085
  extraEnv: []

authorizationServer:
  image:
    repository: authorization-server
    tag: ""   # leave empty to inherit global.image.tag
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  service:
    ports:
      http: 8901
  extraEnv: []

apiGateway:
  image:
    repository: api-gateway
    tag: ""   # leave empty to inherit global.image.tag
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  service:
    ports:
      http: 8080
  extraEnv: []
  ingress:
    enabled: false
    host: ""
    annotations: {}
    alb:
      scheme: internet-facing
      certificateArn: ""
