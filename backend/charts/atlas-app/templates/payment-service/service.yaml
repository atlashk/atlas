apiVersion: v1
kind: Service
metadata:
  name: {{ lower $.Release.Name }}-payment-service
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/instance: {{ lower $.Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  type: {{ .Values.global.service.type }}
  selector:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/instance: {{ lower $.Release.Name }}
  ports:
    - name: http
      port: {{ .Values.paymentSvc.service.ports.http }}
      targetPort: http
