{{- if eq .Values.global.appStack.search "elasticsearch" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ lower $.Release.Name }}-elasticsearch
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/instance: {{ lower $.Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
type: Opaque
data:
  password: {{ .Values.global.elasticsearch.secrets.password | quote }}
{{- end }}
