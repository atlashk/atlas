{{- if eq .Values.global.appStack.datasource "postgres" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ lower $.Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
data:
  initdb.sh: |
{{ tpl (.Files.Get "files/postgres/initdb.sh.tpl") . | indent 4 }}
{{- end }}
