{{- if eq .Values.global.appStack.datasource "mysql" }}
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/instance: {{ lower $.Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/instance: {{ lower $.Release.Name }}
  ports:
    - name: mysql
      port: {{ .Values.global.mysql.service.ports.mysql }}
      targetPort: mysql
{{- end }}
