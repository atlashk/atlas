{{- if eq .Values.global.appStack.storage "minio" }}
apiVersion: v1
kind: Secret
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: {{ lower $.Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
type: Opaque
data:
  root-user: {{ .Values.global.minio.secrets.rootUser }}
  root-password: {{ .Values.global.minio.secrets.rootPassword }}
{{- end }}
