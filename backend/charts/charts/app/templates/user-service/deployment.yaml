apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/instance: {{ lower $.Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.global.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: user-service
      app.kubernetes.io/instance: {{ lower $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-service
        app.kubernetes.io/instance: {{ lower $.Release.Name }}
    spec:
      serviceAccountName: {{ .Values.global.serviceAccount.name | default "app-namespace-reader" }}
      {{- $deps := list -}}
      {{- if eq .Values.global.appStack.datasource "mysql" -}}
      {{- $deps = append $deps (dict "name" "mysql" "host" "mysql" "port" .Values.global.mysql.service.ports.mysql) -}}
      {{- end -}}
      {{- if eq .Values.global.appStack.datasource "postgres" -}}
      {{- $deps = append $deps (dict "name" "postgres" "host" "postgres" "port" .Values.global.postgres.service.ports.postgres) -}}
      {{- end -}}
      {{- if eq .Values.global.appStack.idp "keycloak" -}}
      {{- $deps = append $deps (dict "name" "keycloak" "host" (include "atlas.infra.keycloak" .) "port" .Values.global.keycloak.service.ports.http) -}}
      {{- end -}}
      {{- include "atlas.waitFor.initContainers" (dict "deps" $deps) | nindent 6 }}
      containers:
        - name: user-service
          image: "{{ if .Values.global.image.registry -}}{{ .Values.global.image.registry }}/{{ end -}}{{ .Values.global.userSvc.image.repository }}:{{ .Values.global.userSvc.image.tag | default .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.global.userSvc.service.ports.http }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.global.springProfilesActive | quote }}
            {{- if eq .Values.global.appStack.datasource "mysql" }}
            - name: DB_URL
              value: "jdbc:mysql://mysql:{{ .Values.global.mysql.service.ports.mysql }}/db_user?useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql
                  key: password
            {{- end }}
            {{- if eq .Values.global.appStack.datasource "postgres" }}
            - name: DB_URL
              value: "jdbc:postgresql://postgres:{{ .Values.global.postgres.service.ports.postgres }}/db_user"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
            {{- end }}
            {{- if eq .Values.global.appStack.idp "keycloak" }}
            - name: KEYCLOAK_BASE_URL
              value: "http://keycloak:{{ .Values.global.keycloak.service.ports.http }}"
            - name: KEYCLOAK_REALM
              valueFrom:
                configMapKeyRef:
                  name: keycloak-config
                  key: keycloak-realm
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: keycloak-config
                  key: keycloak-admin-client-id
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                configMapKeyRef:
                  name: keycloak-config
                  key: keycloak-admin-client-secret
            {{- end }}
            {{- if eq .Values.global.appStack.observability.tracing "zipkin" }}
            - name: ZIPKIN_ENDPOINT
              value: "http://zipkin:{{ .Values.global.zipkin.service.ports.http }}/api/v2/spans"
            {{- end }}
            {{- if eq .Values.global.appStack.observability.tracing "tempo" }}
            - name: OTEL_COLLECTOR_TRACES_ENDPOINT
              value: "http://otel-collector:{{ .Values.global.otelCollector.service.ports.otlpHttp }}/v1/traces"
            {{- end }}
            {{- with .Values.global.userSvc.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{ toYaml .Values.global.userSvc.resources | nindent 12 }}
          volumeMounts:
            - name: user-service-logs
              mountPath: /var/log/user-service
      volumes:
        - name: user-service-logs
          emptyDir: {}
      terminationGracePeriodSeconds: 30
