apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  labels:
    app.kubernetes.io/name: catalog-service
    app.kubernetes.io/instance: {{ lower $.Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.global.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-service
      app.kubernetes.io/instance: {{ lower $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-service
        app.kubernetes.io/instance: {{ lower $.Release.Name }}
    spec:
      serviceAccountName: {{ .Values.global.serviceAccount.name | default "app-namespace-reader" }}
      {{- $deps := list -}}
      {{- if eq .Values.global.appStack.datasource "mysql" -}}
      {{- $deps = append $deps (dict "name" "mysql" "host" "mysql" "port" .Values.global.mysql.service.ports.mysql) -}}
      {{- end -}}
      {{- if eq .Values.global.appStack.datasource "postgres" -}}
      {{- $deps = append $deps (dict "name" "postgres" "host" "postgres" "port" .Values.global.postgres.service.ports.postgres) -}}
      {{- end -}}
      {{- if eq .Values.global.appStack.search "elasticsearch" -}}
      {{- $deps = append $deps (dict "name" "elasticsearch" "host" "elasticsearch" "port" .Values.global.elasticsearch.service.ports.http) -}}
      {{- end -}}
      {{- include "atlas.waitFor.initContainers" (dict "deps" $deps) | nindent 6 }}
      containers:
        - name: catalog-service
          image: "{{ if .Values.global.image.registry -}}{{ .Values.global.image.registry }}/{{ end -}}{{ .Values.global.catalogSvc.image.repository }}:{{ .Values.global.catalogSvc.image.tag | default .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.global.catalogSvc.service.ports.http }}
            {{- if eq .Values.global.appStack.internal "grpc" }}
            - name: grpc
              containerPort: {{ .Values.global.catalogSvc.service.ports.grpc }}
            {{- end }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.global.springProfilesActive | quote }}
            {{- if eq .Values.global.appStack.datasource "mysql" }}
            - name: DB_URL
              value: "jdbc:mysql://mysql:{{ .Values.global.mysql.service.ports.mysql }}/db_catalog?useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql
                  key: password
            {{- end }}
            {{- if eq .Values.global.appStack.datasource "postgres" }}
            - name: DB_URL
              value: "jdbc:postgresql://postgres:{{ .Values.global.postgres.service.ports.postgres }}/db_catalog"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
            {{- end }}
            {{- if eq .Values.global.appStack.kvStore "redis" }}
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: {{ .Values.global.redis.service.ports.redis | quote }}
            {{- end }}
            {{- if eq .Values.global.appStack.messaging "kafka" }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:{{ .Values.global.kafka.service.ports.kafkaInternal }}"
            {{- end }}
            {{- if eq .Values.global.appStack.messaging "rabbitmq" }}
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_PORT
              value: {{ .Values.global.rabbitmq.service.ports.amqp | quote }}
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq
                  key: user
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq
                  key: password
            {{- end }}
            {{- if eq .Values.global.appStack.search "elasticsearch" }}
            - name: ELASTICSEARCH_HOST
              value: "elasticsearch"
            - name: ELASTICSEARCH_PORT
              value: {{ .Values.global.elasticsearch.service.ports.http | quote }}
            - name: ELASTICSEARCH_USERNAME
              value: "elastic"
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch
                  key: password
            {{- end }}
            {{- if eq .Values.global.appStack.storage "minio" }}
            - name: MINIO_ENDPOINT
              value: "http://minio:{{ .Values.global.minio.service.ports.s3 }}"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio
                  key: root-user
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio
                  key: root-password
            {{- end }}
            {{- if eq .Values.global.appStack.observability.tracing "zipkin" }}
            - name: ZIPKIN_ENDPOINT
              value: "http://zipkin:{{ .Values.global.zipkin.service.ports.http }}/api/v2/spans"
            {{- end }}
            {{- if eq .Values.global.appStack.observability.tracing "tempo" }}
            - name: OTEL_COLLECTOR_TRACES_ENDPOINT
              value: "http://otel-collector:{{ .Values.global.otelCollector.service.ports.otlpHttp }}/v1/traces"
            {{- end }}
            {{- with .Values.global.catalogSvc.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{ toYaml .Values.global.catalogSvc.resources | nindent 12 }}
          volumeMounts:
            - name: catalog-service-logs
              mountPath: /var/log/catalog-service
      volumes:
        - name: catalog-service-logs
          emptyDir: {}
      terminationGracePeriodSeconds: 30
