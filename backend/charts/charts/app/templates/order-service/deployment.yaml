apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ lower $.Release.Name }}-order-service
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/instance: {{ lower $.Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.global.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
      app.kubernetes.io/instance: {{ lower $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
        app.kubernetes.io/instance: {{ lower $.Release.Name }}
    spec:
      serviceAccountName: {{ lower $.Release.Name }}-{{ .Values.global.serviceAccount.name | default "namespace-reader" }}
      {{- $deps := list -}}
      {{- if eq .Values.global.appStack.datasource "mysql" -}}
      {{- $deps = append $deps (dict "name" "mysql" "host" (printf "%s-mysql" (lower $.Release.Name)) "port" .Values.global.mysql.service.ports.mysql) -}}
      {{- end -}}
      {{- if eq .Values.global.appStack.datasource "postgres" -}}
      {{- $deps = append $deps (dict "name" "postgres" "host" (printf "%s-postgres" (lower $.Release.Name)) "port" .Values.global.postgres.service.ports.postgres) -}}
      {{- end -}}
      {{- include "atlas.waitFor.initContainers" (dict "deps" $deps) | nindent 6 }}
      containers:
        - name: order-service
          image: "{{ if .Values.global.image.registry -}}{{ .Values.global.image.registry }}/{{ end -}}{{ .Values.global.orderSvc.image.repository }}:{{ .Values.global.orderSvc.image.tag | default .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.global.orderSvc.service.ports.http }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.global.springProfilesActive | quote }}
            {{- if eq .Values.global.appStack.datasource "mysql" }}
            - name: DB_URL
              value: "jdbc:mysql://{{ printf "%s-mysql" (lower $.Release.Name) }}:{{ .Values.global.mysql.service.ports.mysql }}/db_order?useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-mysql" (lower $.Release.Name) }}
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-mysql" (lower $.Release.Name) }}
                  key: password
            {{- end }}
            {{- if eq .Values.global.appStack.datasource "postgres" }}
            - name: DB_URL
              value: "jdbc:postgresql://{{ printf "%s-postgres" (lower $.Release.Name) }}:{{ .Values.global.postgres.service.ports.postgres }}/db_order"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-postgres" (lower $.Release.Name) }}
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-postgres" (lower $.Release.Name) }}
                  key: password
            {{- end }}
            {{- if eq .Values.global.appStack.kvStore "redis" }}
            - name: REDIS_HOST
              value: "{{ lower $.Release.Name }}-redis"
            - name: REDIS_PORT
              value: {{ .Values.global.redis.service.ports.redis | quote }}
            {{- end }}
            {{- if eq .Values.global.appStack.messaging "kafka" }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "{{ lower $.Release.Name }}-kafka:{{ .Values.global.kafka.service.ports.kafkaInternal }}"
            {{- end }}
            {{- if eq .Values.global.appStack.messaging "rabbitmq" }}
            - name: RABBITMQ_HOST
              value: "{{ lower $.Release.Name }}-rabbitmq"
            - name: RABBITMQ_PORT
              value: {{ .Values.rabbitmq.service.ports.amqp | quote }}
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ lower $.Release.Name }}-rabbitmq
                  key: user
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ lower $.Release.Name }}-rabbitmq
                  key: password
            {{- end }}
            {{- if eq .Values.global.appStack.internal "grpc" }}
            - name: API_CLIENT_GRPC_CATALOG_SERVICE_ADDRESS
              value: "static://{{ lower $.Release.Name }}-catalog-service:{{ .Values.global.catalogSvc.service.ports.grpc }}"
            {{- end }}
            {{- if eq .Values.global.appStack.internal "rest" }}
            - name: INTERNAL_REST_CATALOG_SERVICE_BASE_URL
              value: "http://{{ lower $.Release.Name }}-catalog-service:{{ .Values.global.catalogSvc.service.ports.http }}"
            {{- end }}
            {{- if eq .Values.global.appStack.observability.tracing "zipkin" }}
            - name: ZIPKIN_ENDPOINT
              value: "http://{{ lower $.Release.Name }}-zipkin:{{ .Values.zipkin.service.ports.http }}/api/v2/spans"
            {{- end }}
            {{- if eq .Values.global.appStack.observability.tracing "tempo" }}
            - name: OTEL_COLLECTOR_TRACES_ENDPOINT
              value: "http://{{ lower $.Release.Name }}-otel-collector:{{ .Values.global.otelCollector.service.ports.otlpHttp }}/v1/traces"
            {{- end }}
            {{- with .Values.global.orderSvc.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{ toYaml .Values.global.orderSvc.resources | nindent 12 }}
          volumeMounts:
            - name: order-service-logs
              mountPath: /var/log/order-service
      volumes:
        - name: order-service-logs
          emptyDir: {}
      terminationGracePeriodSeconds: 30
