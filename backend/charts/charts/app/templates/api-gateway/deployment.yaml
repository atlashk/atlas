apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/instance: {{ lower $.Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.global.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
      app.kubernetes.io/instance: {{ lower $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/instance: {{ lower $.Release.Name }}
    spec:
      serviceAccountName: {{ .Values.global.serviceAccount.name | default "app-namespace-reader" }}
      containers:
        - name: api-gateway
          image: "{{ if .Values.global.image.registry -}}{{ .Values.global.image.registry }}/{{ end -}}{{ .Values.global.apiGateway.image.repository }}:{{ .Values.global.apiGateway.image.tag | default .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.global.springProfilesActive | quote }}
            - name: USER_SERVICE_URI
              value: "http://user-service:{{ .Values.global.userSvc.service.ports.http }}"
            - name: CATALOG_SERVICE_URI
              value: "http://catalog-service:{{ .Values.global.catalogSvc.service.ports.http }}"
            - name: INVENTORY_SERVICE_URI
              value: "http://inventory-service:{{ .Values.global.inventorySvc.service.ports.http }}"
            - name: ORDER_SERVICE_URI
              value: "http://order-service:{{ .Values.global.orderSvc.service.ports.http }}"
            - name: PAYMENT_SERVICE_URI
              value: "http://payment-service:{{ .Values.global.paymentSvc.service.ports.http }}"
            {{- if eq .Values.global.appStack.kvStore "redis" }}
            - name: REDIS_HOST
              value: {{ include "redis.hostname" . | quote }}
            - name: REDIS_PORT
              value: {{ .Values.global.redis.service.ports.redis | quote }}
            {{- end }}
            {{- if eq .Values.global.appStack.idp "spring" }}
            - name: JWK_SET_URI
              value: "http://authorization-server:{{ .Values.global.authorizationServer.service.ports.http }}/.well-known/jwks.json"
            {{- end }}
            {{- if eq .Values.global.appStack.idp "keycloak" }}
            - name: JWK_SET_URI
              value: "http://{{ include "keycloak.hostname" . }}:{{ .Values.global.keycloak.service.ports.http }}/realms/{{ .Values.global.keycloak.config.realm }}/protocol/openid-connect/certs"
            {{- end }}
            {{- if eq .Values.global.appStack.observability.tracing "zipkin" }}
            - name: ZIPKIN_ENDPOINT
              value: "http://{{ include "zipkin.hostname" . }}:{{ .Values.global.zipkin.service.ports.http }}/api/v2/spans"
            {{- end }}
            {{- if eq .Values.global.appStack.observability.tracing "tempo" }}
            - name: OTEL_COLLECTOR_TRACES_ENDPOINT
              value: "http://{{ include "otelCollector.hostname" . }}:{{ .Values.global.otelCollector.service.ports.otlpHttp }}/v1/traces"
            {{- end }}
            {{- if gt (len .Values.global.apiGateway.extraEnv) 0 }}
            {{- toYaml .Values.global.apiGateway.extraEnv | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{ toYaml .Values.global.apiGateway.resources | nindent 12 }}
          volumeMounts:
            - name: api-gateway-logs
              mountPath: /var/log/api-gateway
      volumes:
        - name: api-gateway-logs
          emptyDir: {}
      terminationGracePeriodSeconds: 30
