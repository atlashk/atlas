{{- if eq .Values.global.appStack.observability.tracing "tempo" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ lower $.Release.Name }}-otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: {{ lower $.Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
data:
  config.yaml: |
{{ tpl (.Files.Get "files/otel-collector/otel-collector-config.yaml.tpl") . | indent 4 }}
{{- end }}
