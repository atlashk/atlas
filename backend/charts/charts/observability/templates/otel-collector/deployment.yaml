{{- if eq .Values.global.appStack.observability.tracing "tempo" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ lower $.Release.Name }}-otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: {{ lower $.Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.global.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
      app.kubernetes.io/instance: {{ lower $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/instance: {{ lower $.Release.Name }}
    spec:
      containers:
        - name: otel-collector
          image: "{{ .Values.global.otelCollector.image.repository }}:{{ .Values.global.otelCollector.image.tag }}"
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/otelcol-contrib/config.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          startupProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{ toYaml .Values.global.otelCollector.resources | nindent 12 }}
          volumeMounts:
            - name: otel-collector-config
              mountPath: /etc/otelcol-contrib
      volumes:
        - name: otel-collector-config
          configMap:
            name: {{ lower $.Release.Name }}-otel-collector
{{- end }}
