{{- if eq .Values.global.appStack.observability.logging.stack "loki" }}
# DaemonSet ensures Promtail runs on every node in the cluster
# This is necessary because logs are stored locally on each node
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/instance: {{ lower $.Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: promtail
      app.kubernetes.io/instance: {{ lower $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: promtail
        app.kubernetes.io/instance: {{ lower $.Release.Name }}
    spec:
      serviceAccountName: {{ .Values.global.promtail.serviceAccount }}
      {{- $deps := list -}}
      {{- $deps = append $deps (dict "name" "loki" "host" "loki" "port" .Values.global.loki.service.ports.http) -}}
      {{- include "atlas.waitFor.initContainers" (dict "deps" $deps) | nindent 6 }}
      containers:
        - name: promtail
          image: "{{ .Values.global.promtail.image.repository }}:{{ .Values.global.promtail.image.tag }}"
          args:
            - -config.file=/etc/promtail/config.yml
          env:
            # Make node name available as environment variable
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 9080
          # No need startupProbe because Promtail is fast to start
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{ toYaml .Values.global.promtail.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: positions
              mountPath: /run/promtail
            # Mount host's /var/log to read container logs
            - name: varlog
              mountPath: /var/log
              readOnly: true  # Read-only access for security
            # Mount Docker container directory (if using Docker runtime)
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true  # Read-only access for security
      volumes:
        - name: config
          configMap:
            name: promtail
        - name: positions
          emptyDir: {}
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
      terminationGracePeriodSeconds: 10
{{- end }}
