global:
  # Default values for atlas.
  # This is a YAML-formatted file.
  # Declare variables to be passed into your templates.

  # This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
  replicaCount: 1

  # This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
  image:
    registry: ""
    repository: ""
    # This sets the pull policy for images.
    pullPolicy: Never
    # Overrides the image tag whose default is the chart appVersion.
    tag: latest

  # This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  imagePullSecrets: []
  # This is to override the chart name.
  nameOverride: ""
  fullnameOverride: ""

  # This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
  serviceAccount:
    # Specifies whether a service account should be created.
    create: true
    # Automatically mount a ServiceAccount's API credentials?
    automount: true
    # Annotations to add to the service account.
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template.
    name: "app-namespace-reader"

  # This is for setting Kubernetes Annotations to a Pod.
  # For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  podAnnotations: {}
  # This is for setting Kubernetes Labels to a Pod.
  # For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  podLabels: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  # This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
  service:
    # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
    type: ClusterIP
    # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
    port: 80

  # This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
  ingress:
    enabled: false
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
      # - secretName: chart-example-tls
      #   hosts:
      #     - chart-example.local

  # -- Expose the service via gateway-api HTTPRoute
  # Requires Gateway API resources and suitable controller installed within the cluster
  # (see: https://gateway-api.sigs.k8s.io/guides/)
  httpRoute:
    # HTTPRoute enabled.
    enabled: false
    # HTTPRoute annotations.
    annotations: {}
    # Which Gateways this Route is attached to.
    parentRefs:
    - name: gateway
      sectionName: http
      # namespace: default
    # Hostnames matching HTTP header.
    hostnames:
    - chart-example.local
    # List of rules and filters applied.
    rules:
    - matches:
      - path:
          type: PathPrefix
          value: /headers
    #   filters:
    #   - type: RequestHeaderModifier
    #     requestHeaderModifier:
    #       set:
    #       - name: My-Overwrite-Header
    #         value: this-is-the-only-value
    #       remove:
    #       - User-Agent
    # - matches:
    #   - path:
    #       type: PathPrefix
    #       value: /echo
    #     headers:
    #     - name: version
    #       value: v2

  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  livenessProbe:
    httpGet:
      path: /
      port: http
  readinessProbe:
    httpGet:
      path: /
      port: http

  # This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  # Additional volumes on the output Deployment definition.
  volumes: []
    # - name: foo
    #   secret:
    #     secretName: mysecret
    #     optional: false

  # Additional volumeMounts on the output Deployment definition.
  volumeMounts: []
    # - name: foo
    #   mountPath: "/etc/foo"
    #   readOnly: true

  persistence:
    storageClass: "gp3"

  nodeSelector: {}

  tolerations: []

  affinity: {}

  secret:
    username: &defaultUsername YXRsYXM=
    password: &defaultPassword QXRsYXNAMTIzNDU2

  springProfilesActive: dev

  # Namespaces for cross-namespace service DNS resolution.
  # Each sub-chart is deployed to its own namespace (see Makefile HELM_NS_* variables).
  namespaces:
    infra: infra
    security: security
    observability: observability

  # appStack is nested under `global` so Helm automatically propagates it to every subchart.
  # In templates, reference it as: .Values.global.appStack.<key>
  appStack:
    ai:
      vectorstore:
        qdrant: true
    datasource: mysql
    file:
      csv: opencsv
      excel: poi
      pdf: pdfbox
    search: elasticsearch
    idp: spring
    internal: rest
    kvStore: redis
    messaging: kafka
    migration: flyway
    notification:
      email: spring
    observability:
      logging:
        stack: loki
        framework: logback
      metrics: prometheus
      tracing: tempo
    persistence: jpa
    redis: standalone
    scheduler: quartz
    serviceDiscovery: kubernetes
    storage: minio
    template: freemarker

  # Infra layer
  # --------------------------------------------------------------------------------------------------

  elasticsearch:
    image:
      repository: docker.elastic.co/elasticsearch/elasticsearch
      tag: 9.2.5
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1500m
        memory: 2Gi
    secrets:
      password: *defaultPassword
    service:
      ports:
        http: 9200
        transport: 9300

  kafka:
    image:
      repository: confluentinc/cp-kafka
      tag: 7.9.0
    resources:
      requests:
        cpu: 300m
        memory: 768Mi
      limits:
        cpu: 1000m
        memory: 1.5Gi
    service:
      ports:
        kafka: 9092
        kafkaInternal: 29092
        controller: 29093
        jmx: 9101

  minio:
    image:
      repository: minio/minio
      tag: latest
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    secrets:
      rootUser: *defaultUsername
      rootPassword: *defaultPassword
    service:
      ports:
        s3: 9000
        console: 9001

  mysql:
    image:
      repository: mysql
      tag: 8.0.33
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    secrets:
      rootPassword: *defaultPassword
      user: *defaultUsername
      password: *defaultPassword
    service:
      ports:
        mysql: 3306

  postgres:
    image:
      repository: postgres
      tag: 14
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    secrets:
      user: *defaultUsername
      password: *defaultPassword
    service:
      ports:
        postgres: 5432

  qdrant:
    image:
      repository: qdrant/qdrant
      tag: v1.13.0
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    service:
      ports:
        http: 6333
        grpc: 6334

  rabbitmq:
    image:
      repository: rabbitmq
      tag: 3.13-management-alpine
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    secrets:
      user: *defaultUsername
      password: *defaultPassword
    service:
      ports:
        amqp: 5672
        management: 15672

  redis:
    image:
      repository: redis
      tag: 7
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    service:
      ports:
        redis: 6379

  smtp4dev:
    image:
      repository: rnwood/smtp4dev
      tag: latest
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    service:
      ports:
        http: 80
        smtp: 25

  # Security layer
  # --------------------------------------------------------------------------------------------------

  keycloak:
    image:
      repository: quay.io/keycloak/keycloak
      tag: 26.5.4
    resources:
      requests:
        cpu: 500m
        memory: 1741Mi
      limits:
        cpu: 2000m
        memory: 2Gi
    config:
      realm: default
      clients:
        adminClient:
          clientId: admin-client
          clientSecret: 9cvF5MPJnwfhEOCwNnQ79RmlkckAsDCj
        webClient:
          clientId: web-client
          redirectUris:
            - http://localhost:8000/login/keycloak/callback
          postLogoutRedirectUris:
            - http://localhost:8000
          webOrigins:
            - "*"
    secret:
      adminUsername: *defaultUsername
      adminPassword: *defaultPassword
    service:
      ports:
        http: 8080

  # Observability layer
  # --------------------------------------------------------------------------------------------------

  loki:
    image:
      repository: grafana/loki
      tag: main
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    service:
      ports:
        http: 3100

  promtail:
    image:
      repository: grafana/promtail
      tag: main
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    serviceAccount: promtail

  prometheus:
    image:
      repository: prom/prometheus
      tag: main
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    service:
      ports:
        http: 9090

  tempo:
    image:
      repository: grafana/tempo
      tag: 2.9.1
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    service:
      ports:
        http: 3200
        grpc: 9095
        otlpGrpc: 4317
        otlpHttp: 4318

  zipkin:
    image:
      repository: openzipkin/zipkin
      tag: latest
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    service:
      ports:
        http: 9411

  otelCollector:
    image:
      repository: otel/opentelemetry-collector-contrib
      tag: latest
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    service:
      ports:
        otlpGrpc: 4317
        otlpHttp: 4318
        health: 13133

  grafana:
    image:
      repository: grafana/grafana-oss
      tag: main
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    secrets:
      adminUser: *defaultUsername
      adminPassword: *defaultPassword
    service:
      ports:
        http: 3000
    # ── ALB Ingress ─────────────────────────────────────────────────────────────
    # Creates an ALB (or joins an existing IngressGroup) that routes to Grafana.
    # The AWS Load Balancer Controller must be installed in the cluster.
    ingress:
      # Set to true to expose Grafana via an ALB.
      enabled: false

      # Public hostname for Grafana (e.g. grafana.example.com).
      # When empty, the ALB auto-generated DNS name is used.
      host: ""

      # Extra ALB annotations merged with the defaults.
      annotations: {}

      alb:
        # ALB scheme: internet-facing (public) or internal (VPC-only).
        scheme: internet-facing
        # ACM certificate ARN for HTTPS termination.
        # When set: listens on HTTP 80 + HTTPS 443 and redirects HTTP → HTTPS.
        # When empty: HTTP-only on port 80.
        certificateArn: ""
        # IngressGroup name — set the same value on grafana and api-gateway
        # ingresses so they share a single ALB instead of creating two.
        # e.g. groupName: "atlas"
        groupName: ""

  # App layer
  # --------------------------------------------------------------------------------------------------

  userSvc:
    image:
      repository: user-service
      tag: latest
    extraEnv: []
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    service:
      ports:
        http: 8081

  catalogSvc:
    image:
      repository: catalog-service
      tag: latest
    extraEnv: []
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    service:
      ports:
        http: 8082
        grpc: 50052

  inventorySvc:
    image:
      repository: inventory-service
      tag: latest
    extraEnv: []
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    service:
      ports:
        http: 8083

  orderSvc:
    image:
      repository: order-service
      tag: latest
    extraEnv: []
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    service:
      ports:
        http: 8084

  paymentSvc:
    image:
      repository: payment-service
      tag: latest
    extraEnv: []
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    service:
      ports:
        http: 8085

  authorizationServer:
    image:
      repository: authorization-server
      tag: latest
    extraEnv: []
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    service:
      ports:
        http: 8901

  apiGateway:
    image:
      repository: api-gateway
      tag: latest
    extraEnv: []
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    service:
      ports:
        http: 8080
    # ── ALB Ingress ─────────────────────────────────────────────────────────────
    # Creates an ALB that routes directly to the api-gateway Pods (target-type: ip).
    # The AWS Load Balancer Controller must be installed in the cluster (via Terraform).
    ingress:
      # Set to true to expose the api-gateway via an ALB.
      enabled: false

      # Public hostname — must match the DNS record pointing to the ALB
      # (e.g. api.example.com). When empty, the ALB auto-generated DNS name
      # (*.elb.amazonaws.com) is used.
      host: ""

      # Extra ALB annotations (merged with the defaults above).
      # See: https://kubernetes-sigs.github.io/aws-load-balancer-controller/latest/guide/ingress/annotations/
      # e.g.:
      #   alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
      annotations: {}

      alb:
        # ALB scheme: internet-facing (public ALB) or internal (VPC-only ALB)
        scheme: internet-facing
        # ACM certificate ARN for HTTPS termination at the ALB.
        # When set: ALB listens on HTTP (80) + HTTPS (443) and redirects HTTP → HTTPS (301).
        # When empty: HTTP-only on port 80.
        #
        #   aws acm list-certificates --region <region>
        #
        # certificateArn: "arn:aws:acm:us-east-1:123456789012:certificate/xxxx"
        certificateArn: ""
        # IngressGroup name — set the same value on api-gateway and grafana
        # ingresses so they share a single ALB instead of creating two.
        # e.g. groupName: "atlas"
        groupName: ""
