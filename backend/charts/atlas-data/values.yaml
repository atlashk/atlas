global:
  replicaCount: 1

  persistence:
    storageClass: ""

  service:
    type: ClusterIP

  secret:
    username: &defaultUsername YXRsYXM=
    password: &defaultPassword QXRsYXNAMTIzNDU2

# Node Group scheduling
# --------------------------------------------------------------------------------------------------
nodeGroups:
  infra:
    nodeSelector:
      role: infra
    tolerations:
      - key: dedicated
        operator: Equal
        value: infra
        effect: NoSchedule

# App stack config — controls which data components are deployed
# --------------------------------------------------------------------------------------------------
appStack:
  ai:
    vectorstore:
      qdrant: false
  datasource: mysql
  search: elasticsearch
  idp: spring
  kvStore: redis
  messaging: kafka
  notification:
    email: spring
  storage: minio

# Data service configurations
# --------------------------------------------------------------------------------------------------

elasticsearch:
  image:
    repository: docker.elastic.co/elasticsearch/elasticsearch
    tag: 9.2.5
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1500m
      memory: 2Gi
  secrets:
    password: *defaultPassword
  service:
    ports:
      http: 9200
      transport: 9300

kafka:
  image:
    repository: confluentinc/cp-kafka
    tag: 7.9.0
  resources:
    requests:
      cpu: 300m
      memory: 768Mi
    limits:
      cpu: 1000m
      memory: 1.5Gi
  service:
    ports:
      kafka: 9092
      kafkaInternal: 29092
      controller: 29093
      jmx: 9101

keycloak:
  image:
    repository: quay.io/keycloak/keycloak
    tag: 26.5.4
  resources:
    requests:
      cpu: 500m
      memory: 1741Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  config:
    realm: default
    clients:
      adminClient:
        clientId: admin-client
        clientSecret: 9cvF5MPJnwfhEOCwNnQ79RmlkckAsDCj
      webClient:
        clientId: web-client
        redirectUris:
          - http://localhost:8000/login/keycloak/callback
        postLogoutRedirectUris:
          - http://localhost:8000
        webOrigins:
          - "*"
  secret:
    adminUsername: *defaultUsername
    adminPassword: *defaultPassword
  service:
    ports:
      http: 8080

minio:
  image:
    repository: minio/minio
    tag: latest
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  secrets:
    rootUser: *defaultUsername
    rootPassword: *defaultPassword
  service:
    ports:
      s3: 9000
      console: 9001

mysql:
  image:
    repository: mysql
    tag: 8.0.33
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  secrets:
    rootPassword: *defaultPassword
    user: *defaultUsername
    password: *defaultPassword
  service:
    ports:
      mysql: 3306

postgres:
  image:
    repository: postgres
    tag: 14
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  secrets:
    user: *defaultUsername
    password: *defaultPassword
  service:
    ports:
      postgres: 5432

qdrant:
  image:
    repository: qdrant/qdrant
    tag: v1.13.0
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    ports:
      http: 6333
      grpc: 6334

rabbitmq:
  image:
    repository: rabbitmq
    tag: 3.13-management-alpine
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  secrets:
    user: *defaultUsername
    password: *defaultPassword
  service:
    ports:
      amqp: 5672
      management: 15672

redis:
  image:
    repository: redis
    tag: 7
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  service:
    ports:
      redis: 6379

smtp4dev:
  image:
    repository: rnwood/smtp4dev
    tag: latest
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  service:
    ports:
      http: 80
      smtp: 25
