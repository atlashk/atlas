server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@userRateLimiter}"
                key-resolver: "#{@userKeyResolver}"
          httpclient:
            connect-timeout: 30000 # Connection timeout in milliseconds
            response-timeout: 30s  # Response timeout in ISO-8601 format or duration
            pool:
              max-idle-time: 45m   # Allow connections to stay idle longer for SSE/WebSocket
          routes:
            # Catalog service
            - id: catalog-service
              uri: ${CATALOG_SERVICE_URI:lb://catalog-service}
              predicates:
                - Path=/services/catalog/api/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
                - TokenValidation
                - RewritePath=/services/catalog/api/(?<segment>.*), /api/${segment}
            - id: catalog-service-api-docs
              uri: ${CATALOG_SERVICE_URI:lb://catalog-service}
              predicates:
                - Path=/api-docs/catalog-service
              filters:
                - RewritePath=/api-docs/catalog-service, /api-docs
            # Inventory service
            - id: inventory-service
              uri: ${INVENTORY_SERVICE_URI:lb://inventory-service}
              predicates:
                - Path=/services/inventory/api/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
                - TokenValidation
                - RewritePath=/services/inventory/api/(?<segment>.*), /api/${segment}
            - id: inventory-service-api-docs
              uri: ${INVENTORY_SERVICE_URI:lb://inventory-service}
              predicates:
                - Path=/api-docs/inventory-service
              filters:
                - RewritePath=/api-docs/inventory-service, /api-docs
            # Order service
            - id: order-service
              uri: ${ORDER_SERVICE_URI:lb://order-service}
              predicates:
                - Path=/services/order/api/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
                - TokenValidation
                - RewritePath=/services/order/api/(?<segment>.*), /api/${segment}
            - id: order-service-api-docs
              uri: ${ORDER_SERVICE_URI:lb://order-service}
              predicates:
                - Path=/api-docs/order-service
              filters:
                - RewritePath=/api-docs/order-service, /api-docs
            # Payment service
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URI:lb://payment-service}
              predicates:
                - Path=/services/payment/api/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
                - TokenValidation
                - RewritePath=/services/payment/api/(?<segment>.*), /api/${segment}
            - id: payment-service-webhook
              uri: ${PAYMENT_SERVICE_URI:lb://payment-service}
              predicates:
                - Path=/services/payment/api/webhook/**
              filters:
                - RewritePath=/services/payment/api/webhook/(?<segment>.*), /api/webhook/${segment}
            - id: payment-service-api-docs
              uri: ${PAYMENT_SERVICE_URI:lb://payment-service}
              predicates:
                - Path=/api-docs/payment-service
              filters:
                - RewritePath=/api-docs/payment-service, /api-docs
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
  reactor:
    context-propagation: auto # Enable tracing context propagation for WebFlux
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTHORIZATION_SERVER:localhost:8901}/.well-known/jwks.json

management:
  endpoint:
    gateway:
      access: unrestricted

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Catalog Service
        url: /api-docs/catalog-service
      - name: Inventory Service
        url: /api-docs/inventory-service
      - name: Order Service
        url: /api-docs/order-service
      - name: Payment Service
        url: /api-docs/payment-service
    default-models-expand-depth: -1 # Hide Schemas section
