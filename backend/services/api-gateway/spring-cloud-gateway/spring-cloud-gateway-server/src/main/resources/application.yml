management:
  endpoints:
    web:
      exposure:
        # Spring Cloud Gateway: gateway,refresh,routes
        # curl -X GET http://<gateway-host>:<port>/actuator/gateway/routes
        # curl -X POST http://<gateway-host>:<port>/actuator/gateway/refresh
        include: health,info,prometheus,gateway,refresh,routes
  endpoint:
    gateway:
      access: unrestricted

server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@userRateLimiter}"
                key-resolver: "#{@userKeyResolver}"
          httpclient:
            connect-timeout: 30000  # Connection timeout in milliseconds
            response-timeout: 5m # Response timeout in ISO-8601 format or duration
            pool:
              max-idle-time: 45m # Allow connections to stay idle longer for SSE/WebSocket
          routes:
            # IAM service
            - id: iam-service-front
              uri: ${IAM_SERVICE_URI:lb://iam-service}
              predicates:
                - Path=/services/iam/api/front/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
                - TokenValidation
                - TokenRelay
                - RewritePath=/services/iam/api/front/(?<segment>.*), /api/front/${segment}
            - id: iam-service-admin
              uri: ${IAM_SERVICE_URI:lb://iam-service}
              predicates:
                - Path=/services/iam/api/admin/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
                - TokenValidation
                - Authorization=ADMIN
                - TokenRelay
                - RewritePath=/services/iam/api/admin/(?<segment>.*), /api/admin/${segment}
            - id: iam-service-api-docs
              uri: ${IAM_SERVICE_URI:lb://iam-service}
              predicates:
                - Path=/api-docs/iam-service
              filters:
                - RewritePath=/api-docs/iam-service, /api-docs
            # Product service
            - id: product-service
              uri: ${PRODUCT_SERVICE_URI:lb://product-service}
              predicates:
                - Path=/services/product/api/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
                - RewritePath=/services/product/api/(?<segment>.*), /api/${segment}
            - id: product-service-admin
              uri: ${PRODUCT_SERVICE_URI:lb://product-service}
              predicates:
                - Path=/services/product/api/admin/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
                - TokenValidation
                - Authorization=ADMIN
                - TokenRelay
                - RewritePath=/services/product/api/admin/(?<segment>.*), /api/admin/${segment}
            - id: product-service-api-docs
              uri: ${PRODUCT_SERVICE_URI:lb://product-service}
              predicates:
                - Path=/api-docs/product-service
              filters:
                - RewritePath=/api-docs/product-service, /api-docs
            # Order service
            - id: order-service
              uri: ${ORDER_SERVICE_URI:lb://order-service}
              predicates:
                - Path=/services/order/api/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
                - TokenValidation
                - TokenRelay
                - RewritePath=/services/order/api/(?<segment>.*), /api/${segment}
            - id: order-service-admin
              uri: ${ORDER_SERVICE_URI:lb://order-service}
              predicates:
                - Path=/services/order/api/admin/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
                - TokenValidation
                - Authorization=ADMIN
                - TokenRelay
                - RewritePath=/services/order/api/admin/(?<segment>.*), /api/admin/${segment}
            - id: order-service-api-docs
              uri: ${ORDER_SERVICE_URI:lb://order-service}
              predicates:
                - Path=/api-docs/order-service
              filters:
                - RewritePath=/api-docs/order-service, /api-docs
            # Payment service
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URI:lb://payment-service}
              predicates:
                - Path=/services/payment/api/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
                - TokenValidation
                - TokenRelay
                - RewritePath=/services/payment/api/(?<segment>.*), /api/${segment}
            - id: payment-service-webhook
              uri: ${PAYMENT_SERVICE_URI:lb://payment-service}
              predicates:
                - Path=/services/payment/api/webhook/**
              filters:
                - RewritePath=/services/payment/api/webhook/(?<segment>.*), /api/webhook/${segment}
            - id: payment-service-api-docs
              uri: ${PAYMENT_SERVICE_URI:lb://payment-service}
              predicates:
                - Path=/api-docs/payment-service
              filters:
                - RewritePath=/api-docs/payment-service, /api-docs
            # Notification service
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URI:lb://notification-service}
              predicates:
                - Path=/services/notification/api/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
                - TokenValidation
                - TokenRelay
                - RewritePath=/services/notification/api/(?<segment>.*), /api/${segment}
            - id: notification-service-sse
              uri: ${NOTIFICATION_SERVICE_URI:lb://notification-service}
              predicates:
                - Path=/services/notification/sse/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
                - RewritePath=/services/notification/sse/(?<segment>.*), /sse/${segment}
              metadata:
                response-timeout: -1 # Disables response timeout for SSE
            - id: notification-service-websocket
              uri: ${NOTIFICATION_SERVICE_URI:lb://notification-service}
              predicates:
                - Path=/services/notification/ws/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
                - RewritePath=/services/notification/ws/(?<segment>.*), /ws/${segment}
            - id: notification-service-api-docs
              uri: ${NOTIFICATION_SERVICE_URI:lb://notification-service}
              predicates:
                - Path=/api-docs/notification-service
              filters:
                - RewritePath=/api-docs/notification-service, /api-docs
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
  reactor:
    context-propagation: auto # Enable tracing

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: IAM Service
        url: /api-docs/iam-service
      - name: Product Service
        url: /api-docs/product-service
      - name: Order Service
        url: /api-docs/order-service
      - name: Payment Service
        url: /api-docs/payment-service
      - name: Notification Service
        url: /api-docs/notification-service
    default-models-expand-depth: -1 # Hide Schemas section
