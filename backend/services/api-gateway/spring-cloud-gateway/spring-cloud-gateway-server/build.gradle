plugins {
    id 'java'
    id 'org.springframework.boot' version "${springBootPluginVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementPluginVersion}"
    id 'idea'
}

group = 'org.atlas'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Cloud Gateway Server Webflux
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'

    // API docs
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:3.0.2'

    // KV store
    switch (rootProject.ext.appStack['kv-store']) {
        case 'redis':
            implementation project(':libs.kv-store.redis-reactive')
            break
        default:
            throw new IllegalArgumentException("Unsupported kv-store: ${rootProject.ext.appStack['kv-store']}")
    }
    
    // Observability
    switch (rootProject.ext.appStack['observability.logging.framework']) {
        case 'logback':
            implementation project(':libs.observability.logging.logback')
            break
        default:
            throw new IllegalArgumentException("Unsupported observability.logging.framework: ${rootProject.ext.appStack['observability.logging.framework']}")
    }
    switch (rootProject.ext.appStack['observability.metrics']) {
        case 'none':
            break;
        case 'prometheus':
            implementation project(':libs.observability.metrics.prometheus')
            break
        default:
            throw new IllegalArgumentException("Unsupported observability.metrics: ${rootProject.ext.appStack['observability.metrics']}")
    }
    switch (rootProject.ext.appStack['observability.tracing']) {
        case 'none':
            break
        case 'zipkin':
            implementation project(':libs.observability.tracing.zipkin')
            break
        default:
            throw new IllegalArgumentException("Unsupported observability.tracing: ${rootProject.ext.appStack['observability.tracing']}")
    }
    
    // Security
    switch (rootProject.ext.appStack['identity']) {
        case 'keycloak':
            implementation project(':services.api-gateway.spring-cloud-gateway.security.keycloak')
            break
        case 'jwt':
            implementation project(':services.api-gateway.spring-cloud-gateway.security.jwt')
            break
        default:
            throw new IllegalArgumentException("Unsupported identity: ${rootProject.ext.appStack['identity']}")
    }
    
    // Service discovery
    switch (rootProject.ext.appStack['service-discovery']) {
        case 'none':
            break
        case 'eureka':
            implementation project(':libs.discovery-client.eureka')
            break
        case 'kubernetes':
            implementation project(':libs.discovery-client.kubernetes')
            break
        default:
            throw new IllegalArgumentException("Unsupported service-discovery: ${rootProject.ext.appStack['service-discovery']}")
    }
    
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}


idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}
