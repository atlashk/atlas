plugins {
    id 'java-library'
    id 'org.springframework.boot' version "${springBootPluginVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementPluginVersion}"
    id 'idea'
}

group = 'org.atlas'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // API server
    implementation project(':services.notification.api.server.rest')

    // Datasource
    switch (rootProject.ext.appStack['datasource']) {
        case 'mysql':
            implementation project(':services.notification.datasource.mysql')
            break
        case 'postgres':
            implementation project(':services.notification.datasource.postgres')
            break
        default:
            throw new IllegalArgumentException("Unsupported datasource: ${rootProject.ext.appStack['datasource']}")
    }

    // Messaging
    switch (rootProject.ext.appStack['messaging']) {
        case 'kafka':
            implementation project(':services.notification.messaging.kafka')
            break
        case 'rabbitmq':
            implementation project(':services.notification.messaging.rabbitmq')
            break
        default:
            throw new IllegalArgumentException("Unsupported messaging: ${rootProject.ext.appStack['messaging']}")
    }

    // Migration
    switch (rootProject.ext.appStack['migration']) {
        case 'flyway':
            switch (rootProject.ext.appStack['datasource']) {
                case 'mysql':
                    implementation project(':services.notification.migration.flyway.mysql')
                    break
                case 'postgres':
                    implementation project(':services.notification.migration.flyway.postgres')
                    break
                default:
                    throw new IllegalArgumentException("Unsupported datasource: ${rootProject.ext.appStack['datasource']}")
            }
            break
        default:
            throw new IllegalArgumentException("Unsupported migration: ${rootProject.ext.appStack['migration']}")
    }

    // Notification::Email
    switch (rootProject.ext.appStack['notification.email']) {
        case 'spring':
            implementation project(':libs.notification.email.spring')
            break
        case 'sendgrid':
            implementation project(':libs.notification.email.sendgrid')
            break
        default:
            throw new IllegalArgumentException("Unsupported notification.email: ${rootProject.ext.appStack['notification.email']}")
    }

    // Notification::In-App
    switch (rootProject.ext.appStack['notification.in-app']) {
        case 'sse':
            implementation project(':libs.notification.in-app.sse')
            break
        case 'websocket':
            implementation project(':libs.notification.in-app.websocket')
            break
        default:
            throw new IllegalArgumentException("Unsupported notification.in-app: ${rootProject.ext.appStack['notification.in-app']}")
    }

    // Observability
    implementation project(':libs.observability')

    // Outbox
    implementation project(':libs.outbox')

    // Persistence
    switch (rootProject.ext.appStack['persistence']) {
        case 'jpa':
            implementation project(':services.notification.persistence.jpa')
            break
        default:
            throw new IllegalArgumentException("Unsupported persistence: ${rootProject.ext.appStack['persistence']}")
    }

    // Saga
    implementation project(':libs.saga')

    // Service discovery
    switch (rootProject.ext.appStack['service-discovery']) {
        case 'none':
            break
        case 'eureka':
            implementation project(':libs.discovery-client.eureka')
            break
        case 'kubernetes':
            implementation project(':libs.discovery-client.kubernetes')
            break
        default:
            throw new IllegalArgumentException("Unsupported service-discovery: ${rootProject.ext.appStack['service-discovery']}")
    }

    // Template
    switch (rootProject.ext.appStack['template']) {
        case 'freemarker':
            implementation project(':libs.template.freemarker')
            break
        case 'thymeleaf':
            implementation project(':libs.template.thymeleaf')
            break
        default:
            throw new IllegalArgumentException("Unsupported template: ${rootProject.ext.appStack['template']}")
    }

    // Lombok
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Mapstruct
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
}

bootJar {
    enabled = false
}

jar {
    enabled = true
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}
