plugins {
    id 'java-library'
    id 'org.springframework.boot' version "${springBootPluginVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementPluginVersion}"
    id 'idea'
}

group = 'org.atlas'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    switch (rootProject.ext.appStack['iam']) {
        case 'jwt':
            implementation project(':services.iam.jwt')
            break
        case 'keycloak':
            implementation project(':services.iam.keycloak')
            break
        default:
            throw new IllegalArgumentException("Unsupported IAM: ${rootProject.ext.appStack['iam']}")
    }
}

bootJar {
    enabled = false
}

jar {
    enabled = true
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}
