plugins {
    id 'java-library'
    id 'org.springframework.boot' version "${springBootPluginVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementPluginVersion}"
    id 'idea'
}

group = 'org.atlas'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Datasource
    switch (rootProject.ext.appStack['datasource']) {
        case 'mysql':
            api project(':services.user.datasource.mysql')
            break
        case 'postgres':
            api project(':services.user.datasource.postgres')
            break
        default:
            throw new IllegalArgumentException("Unsupported datasource: ${rootProject.ext.appStack['datasource']}")
    }

    // IdP
    switch (rootProject.ext.appStack['idp']) {
        case 'spring':
            break
        case 'keycloak':
            api project(':services.user.idp.keycloak')
            break
        default:
            throw new IllegalArgumentException("Unsupported datasource: ${rootProject.ext.appStack['idp']}")
    }

    // Migration
    switch (rootProject.ext.appStack['migration']) {
        case 'flyway':
            switch (rootProject.ext.appStack['datasource']) {
                case 'mysql':
                    api project(':services.user.migration.flyway.mysql')
                    break
                case 'postgres':
                    api project(':services.user.migration.flyway.postgres')
                    break
                default:
                    throw new IllegalArgumentException("Unsupported datasource: ${rootProject.ext.appStack['datasource']}")
            }
            break
        default:
            throw new IllegalArgumentException("Unsupported migration: ${rootProject.ext.appStack['migration']}")
    }

    //    implementation project(':libs.observability.actuator')
//    switch (rootProject.ext.appStack['observability.logging.framework']) {
//        case 'logback':
//            implementation project(':libs.observability.logging.logback')
//            break
//        default:
//            throw new IllegalArgumentException("Unsupported observability.logging.framework: ${rootProject.ext.appStack['observability.logging.framework']}")
//    }
//    switch (rootProject.ext.appStack['observability.metrics']) {
//        case 'none':
//            break;
//        case 'prometheus':
//            implementation project(':libs.observability.metrics.prometheus')
//            break
//        default:
//            throw new IllegalArgumentException("Unsupported observability.metrics: ${rootProject.ext.appStack['observability.metrics']}")
//    }
//    switch (rootProject.ext.appStack['observability.tracing']) {
//        case 'none':
//            break
//        case 'zipkin':
//            implementation project(':libs.observability.tracing.zipkin')
//            break
//        default:
//            throw new IllegalArgumentException("Unsupported observability.tracing: ${rootProject.ext.appStack['observability.tracing']}")
//    }
    api project(':libs.observability.opentelemetry')

    // Persistence
    switch (rootProject.ext.appStack.persistence) {
        case 'jpa':
            api project(':services.user.persistence.jpa')
            break
        default:
            throw new IllegalArgumentException("Unsupported persistence: ${rootProject.ext.appStack.persistence}")
    }

    // Sequence generator
    api project(':libs.sequence-generator')

    // Service discovery
    switch (rootProject.ext.appStack['service-discovery']) {
        case 'none':
            break
        case 'eureka':
            api project(':libs.discovery-client.eureka')
            break
        case 'kubernetes':
            api project(':libs.discovery-client.kubernetes')
            break
        default:
            throw new IllegalArgumentException("Unsupported service-discovery: ${rootProject.ext.appStack['service-discovery']}")
    }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.grpc:spring-grpc-dependencies:${springGrpcVersion}"
    }
}

bootJar {
    enabled = false
}

jar {
    enabled = true
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}
