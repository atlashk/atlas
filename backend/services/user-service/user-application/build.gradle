plugins {
    id 'java-library'
    id 'org.springframework.boot' version "${springBootPluginVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementPluginVersion}"
    id 'idea'
}

group = 'org.atlas'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Port
    api project(':services.user.port')

    // Spring Security
    api 'org.springframework.boot:spring-boot-starter-security'

    // OAuth2 Authorization Server
    api 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server'

    // OAuth2 Client (Supports SSO login)
    api 'org.springframework.boot:spring-boot-starter-security-oauth2-client'

    // Supports HTTP handling
    api project(':libs.api.server.rest')

    // Supports OAuth2 login page
    api project(':libs.template.thymeleaf')

    // Lombok
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Mapstruct
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
}

bootJar {
    enabled = false
}

jar {
    enabled = true
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}
