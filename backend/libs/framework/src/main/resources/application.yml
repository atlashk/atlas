app:
  api-client:
    rest:
      connect-timeout: 30
      read-timeout: 30
      ssl:
        enabled: false
  locale: en-US
  messaging:
    gateway: outbox
  notification:
    email:
      sender: admin@atlas.org
  security:
    cors:
      allowed-origins:
        - http://localhost:8000 # Frontend
      allowed-methods:
        - "GET"
        - "POST"
        - "PUT"
        - "PATCH"
        - "DELETE"
        - "OPTIONS"
      allowed-headers:
        - "*"
      exposed-headers:
        - "Content-Disposition"
      allow-credentials: true
      max-age: 0 # always fetch the latest data
    encryption-key: 123456
    default-password: Atlas@123456
