spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:-Atlas@123456}

app:
  messaging:
    rabbitmq:
      exchanges:
        - name: product_events
          type: TOPIC
        - name: stock_events
          type: TOPIC
        - name: order_events
          type: TOPIC
        - name: saga.checkout.commandreply
          type: TOPIC
        - name: saga.checkout.compensationreply
          type: TOPIC
        - name: saga.checkout.command.inventory
          type: TOPIC
        - name: saga.checkout.compensation.inventory
          type: TOPIC
        - name: saga.checkout.command.payment
          type: TOPIC
        - name: saga.checkout.compensation.payment
          type: TOPIC
      queues:
        - name: product_events
        - name: stock_events
        - name: order_events
        - name: saga.checkout.commandreply
        - name: saga.checkout.compensationreply
        - name: saga.checkout.command.inventory
        - name: saga.checkout.compensation.inventory
        - name: saga.checkout.command.payment
        - name: saga.checkout.compensation.payment
      bindings:
        - exchange: product_events
          queue: product_events
          routing-key: product_events
        - exchange: stock_events
          queue: stock_events
          routing-key: stock_events
        - exchange: order_events
          queue: order_events
          routing-key: order_events
        - exchange: saga.checkout.commandreply
          queue: saga.checkout.commandreply
          routing-key: saga.checkout.commandreply
        - exchange: saga.checkout.compensationreply
          queue: saga.checkout.compensationreply
          routing-key: saga.checkout.compensationreply
        - exchange: saga.checkout.command.inventory
          queue: saga.checkout.command.inventory
          routing-key: saga.checkout.command.inventory
        - exchange: saga.checkout.compensation.inventory
          queue: saga.checkout.compensation.inventory
          routing-key: saga.checkout.compensation.inventory
        - exchange: saga.checkout.command.payment
          queue: saga.checkout.command.payment
          routing-key: saga.checkout.command.payment
        - exchange: saga.checkout.compensation.payment
          queue: saga.checkout.compensation.payment
          routing-key: saga.checkout.compensation.payment
