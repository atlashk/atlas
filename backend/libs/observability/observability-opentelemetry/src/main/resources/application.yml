# Base configurations
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  otlp:
    metrics:
      export:
        url: ${OTLP_ENDPOINT:http://localhost:4318/v1/metrics}
  opentelemetry:
    logging:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/logs}
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      probability: 1.0
