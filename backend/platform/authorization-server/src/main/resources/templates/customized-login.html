<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background: #f8fafc; }
  </style>
</head>
<body class="min-h-screen">
  <div class="h-screen flex items-start justify-center pt-40 px-4">
    <div class="w-full max-w-md rounded-xl border bg-white shadow-sm">
      <div class="text-center space-y-2 pb-4 px-6 pt-6">
        <h1 class="text-2xl font-bold text-slate-900">Welcome Back</h1>
        <p class="text-slate-500 mt-2">Sign in to your account</p>
      </div>
      <div class="space-y-6 px-6 pb-6">
        <div
          th:if="${param.error}"
          class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"
        >
          Invalid email or password.
        </div>
        <form method="post" th:action="@{/login}" class="space-y-4">
          <div class="space-y-2">
            <label class="text-sm font-medium text-slate-700">Email</label>
            <div class="relative">
              <i data-lucide="mail" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"></i>
              <input
                type="email"
                name="email"
                required
                class="w-full rounded-md border border-slate-300 pl-10 pr-3 py-2 text-sm outline-none focus:ring-2 focus:ring-slate-300"
                placeholder="Enter your email"
              />
            </div>
          </div>
          <div class="space-y-2">
            <label class="text-sm font-medium text-slate-700">Password</label>
            <div class="relative">
              <i data-lucide="lock" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"></i>
              <input
                id="password"
                type="password"
                name="password"
                required
                class="w-full rounded-md border border-slate-300 pl-10 pr-10 py-2 text-sm outline-none focus:ring-2 focus:ring-slate-300"
                placeholder="Enter your password"
              />
              <button
                id="togglePassword"
                type="button"
                class="absolute right-2 top-1/2 -translate-y-1/2 rounded px-2 py-1 text-xs text-slate-500 hover:text-slate-700"
                aria-label="Show password"
              >
                <i data-lucide="eye" class="eye-icon h-4 w-4"></i>
                <i data-lucide="eye-off" class="eye-off-icon hidden h-4 w-4"></i>
              </button>
            </div>
          </div>
          <button
            type="submit"
            class="w-full rounded-md bg-slate-900 text-white py-2.5 text-sm font-medium hover:bg-slate-800"
          >
            Sign In
          </button>
        </form>
      </div>
    </div>
  </div>
  <script>
    lucide.createIcons();
    const passwordInput = document.getElementById('password');
    const togglePasswordButton = document.getElementById('togglePassword');
    const eyeIcon = togglePasswordButton.querySelector('.eye-icon');
    const eyeOffIcon = togglePasswordButton.querySelector('.eye-off-icon');
    togglePasswordButton.addEventListener('click', function () {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      eyeIcon.classList.toggle('hidden', isPassword);
      eyeOffIcon.classList.toggle('hidden', !isPassword);
      togglePasswordButton.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
    });
  </script>
</body>
</html>
