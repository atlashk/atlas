plugins {
    id 'java-library'
    id 'org.springframework.boot' version "${springBootPluginVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementPluginVersion}"
    id 'idea'
}

group = 'org.atlas'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Domain
    api project(':domain.notification')

    // Infrastructure
    api project(':infrastructure.application-context')
    switch (rootProject.ext.appStack['config']) {
        case 'yaml':
            api project(':infrastructure.config.yaml')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['config']}")
    }
    switch (rootProject.ext.appStack['datasource']) {
        case 'mysql':
            api project(':infrastructure.datasource.mysql.impl.notification')
            break
        case 'postgres':
            api project(':infrastructure.datasource.postgres.impl.notification')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['datasource']}")
    }
    switch (rootProject.ext.appStack['discovery-client']) {
        case 'none':
            break
        case 'eureka':
            api project(':infrastructure.discovery-client.eureka')
            break
        case 'kubernetes':
            api project(':infrastructure.discovery-client.kubernetes')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['discovery-client']}")
    }
    api project(':infrastructure.event.event-handler-decorator')
    switch (rootProject.ext.appStack['kv']) {
        case 'redis':
            api project(':infrastructure.kv.redis')
            break
        case 'dynamodb':
            api project(':infrastructure.kv.dynamodb')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['kv']}")
    }
    switch (rootProject.ext.appStack['messaging']) {
        case 'kafka':
            api project(':infrastructure.messaging.kafka.impl.notification')
            break
        case 'rabbitmq':
            api project(':infrastructure.messaging.rabbitmq.impl.notification')
            break
        case 'sns':
            api project(':infrastructure.messaging.sns.impl.notification')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['messaging']}")
    }
    switch (rootProject.ext.appStack['migration']) {
        case 'flyway':
            switch (rootProject.ext.appStack['datasource']) {
                case 'mysql':
                    api project(':infrastructure.migration.flyway.mysql.impl.notification')
                    break
                case 'postgres':
                    api project(':infrastructure.migration.flyway.postgres.impl.notification')
                    break
                default:
                    throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['datasource']}")
            }
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['migration']}")
    }
    switch (rootProject.ext.appStack['notification.email']) {
        case 'spring':
            api project(':infrastructure.notification.email.spring')
            break
        case 'ses':
            api project(':infrastructure.notification.email.ses')
            break
        case 'sendgrid':
            api project(':infrastructure.notification.email.sendgrid')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['notification.email']}")
    }
    api project(':infrastructure.observability.actuator')
    switch (rootProject.ext.appStack['observability.logging.framework']) {
        case 'logback':
            api project(':infrastructure.observability.logging.logback')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['observability.logging.framework']}")
    }
    switch (rootProject.ext.appStack['observability.metrics']) {
        case 'prometheus':
            api project(':infrastructure.observability.metrics.prometheus')
            break
        case 'cloudwatch':
            api project(':infrastructure.observability.metrics.cloudwatch')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['observability.metrics']}")
    }
    switch (rootProject.ext.appStack['observability.tracing']) {
        case 'zipkin':
            api project(':infrastructure.observability.tracing.zipkin')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['observability.tracing']}")
    }
    if (rootProject.ext.appStack['outbox'] == 'true') {
        api project(':infrastructure.outbox.parent')
    }
    switch (rootProject.ext.appStack['scheduler']) {
        case 'spring':
            api project(':infrastructure.scheduler.spring.impl.notification')
            break
        case 'quartz':
            api project(':infrastructure.scheduler.quartz.impl.notification')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['scheduler']}")
    }
    api project(':infrastructure.notification.sse')
    switch (rootProject.ext.appStack['template']) {
        case 'freemarker':
            api project(':infrastructure.template.freemarker')
            break
        case 'thymeleaf':
            api project(':infrastructure.template.thymeleaf')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['template']}")
    }
    api project(':infrastructure.use-case.use-case-handler-decorator')
    api project(':infrastructure.notification.websocket')
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

test {
    useJUnitPlatform()
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}
