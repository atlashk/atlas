plugins {
    id 'java-library'
    id 'org.springframework.boot' version "${springBootPluginVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementPluginVersion}"
    id 'idea'
}

group = 'org.atlas'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Domain
    api project(':domain.product')

    // Infrastructure
    switch (rootProject.ext.appStack['api-server']) {
        case 'rest':
            api project(':infrastructure.spring-boot.api-server.rest.adapter.product')
            break
        case 'grpc':
            api project(':infrastructure.spring-boot.api-server.grpc.netdevh.adapter.product')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['api-server']}")
    }
    switch (rootProject.ext.appStack['cache']) {
        case 'simple':
            api project(':infrastructure.spring-boot.cache.simple')
            break
        case 'redis':
            api project(':infrastructure.spring-boot.cache.redis')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['cache']}")
    }
    api project(':infrastructure.spring-boot.bootstrap')
    switch (rootProject.ext.appStack['config']) {
        case 'yaml':
            api project(':infrastructure.spring-boot.config.yaml')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['config']}")
    }
    switch (rootProject.ext.appStack['datasource']) {
        case 'mysql':
            api project(':infrastructure.spring-boot.datasource.mysql.adapter.product')
            break
        case 'postgres':
            api project(':infrastructure.spring-boot.datasource.postgres.adapter.product')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['datasource']}")
    }
    switch (rootProject.ext.appStack['discovery-client']) {
        case 'none':
            break
        case 'eureka':
            api project(':infrastructure.spring-boot.discovery-client.eureka')
            break
        case 'kubernetes':
            api project(':infrastructure.spring-boot.discovery-client.kubernetes')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['discovery-client']}")
    }
    switch (rootProject.ext.appStack['file.csv']) {
        case 'opencsv':
            api project(':infrastructure.spring-boot.file.csv.opencsv.adapter.product')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['file.csv']}")
    }
    switch (rootProject.ext.appStack['file.excel']) {
        case 'easyexcel':
            api project(':infrastructure.spring-boot.file.excel.easyexcel.adapter.product')
            break
        case 'poi':
            api project(':infrastructure.spring-boot.file.excel.poi.adapter.product')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['file.excel']}")
    }
    switch (rootProject.ext.appStack['file.pdf']) {
        case 'pdfbox':
            api project(':infrastructure.spring-boot.file.pdf.pdfbox.adapter.product')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['file.pdf']}")
    }
    switch (rootProject.ext.appStack['lock']) {
        case 'redisson':
            api project(':infrastructure.spring-boot.lock.redisson')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['lock']}")
    }
    switch (rootProject.ext.appStack['messaging']) {
        case 'kafka':
            api project(':infrastructure.spring-boot.messaging.kafka.adapter.product')
            break
        case 'sns':
            api project(':infrastructure.spring-boot.messaging.sns.adapter.product')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['messaging']}")
    }
    api project(':infrastructure.spring-boot.event.event-handler-decorator')
    api project(':infrastructure.spring-boot.observability.actuator')
    switch (rootProject.ext.appStack['observability.logging.framework']) {
        case 'logback':
            api project(':infrastructure.spring-boot.observability.logging.logback')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['observability.logging.framework']}")
    }
    switch (rootProject.ext.appStack['observability.metrics']) {
        case 'prometheus':
            api project(':infrastructure.spring-boot.observability.metrics.prometheus')
            break
        case 'cloudwatch':
            api project(':infrastructure.spring-boot.observability.metrics.cloudwatch')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['observability.metrics']}")
    }
    switch (rootProject.ext.appStack['observability.tracing']) {
        case 'zipkin':
            api project(':infrastructure.spring-boot.observability.tracing.zipkin')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['observability.tracing']}")
    }
    switch (rootProject.ext.appStack['persistence']) {
        case 'jpa':
            api project(':infrastructure.spring-boot.persistence.jpa.adapter.product')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['persistence']}")
    }
    switch (rootProject.ext.appStack['scheduler']) {
        case 'spring':
            api project(':infrastructure.spring-boot.scheduler.spring.adapter.product')
            break
        case 'quartz':
            api project(':infrastructure.spring-boot.scheduler.quartz.adapter.product')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['scheduler']}")
    }
    switch (rootProject.ext.appStack['storage']) {
        case 'filesystem':
            api project(':infrastructure.spring-boot.storage.filesystem')
            break
        case 's3':
            api project(':infrastructure.spring-boot.storage.s3')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['storage']}")
    }
    api project(':infrastructure.spring-boot.use-case.use-case-handler-decorator')

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

test {
    useJUnitPlatform()
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}
