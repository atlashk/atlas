plugins {
    id 'java-library'
    id 'org.springframework.boot' version "${springBootPluginVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementPluginVersion}"
    id 'idea'
}

group = 'org.atlas'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Domain
    api project(':domain.user')

    // Infrastructure
    switch (rootProject.ext.appStack['api-server']) {
        case 'rest':
            api project(':infrastructure.api-server.rest.adapter.user')
            break
        case 'grpc':
            api project(':infrastructure.api-server.grpc.netdevh.adapter.user')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['api-server']}")
    }
    api project(':infrastructure.auth-server')
    api project(':infrastructure.bootstrap')
    switch (rootProject.ext.appStack['config']) {
        case 'yaml':
            api project(':infrastructure.config.yaml')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['config']}")
    }
    switch (rootProject.ext.appStack['datasource']) {
        case 'mysql':
            api project(':infrastructure.datasource.mysql.adapter.user')
            break
        case 'postgres':
            api project(':infrastructure.datasource.postgres.adapter.user')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['datasource']}")
    }
    switch (rootProject.ext.appStack['discovery-client']) {
        case 'none':
            break
        case 'eureka':
            api project(':infrastructure.discovery-client.eureka')
            break
        case 'kubernetes':
            api project(':infrastructure.discovery-client.kubernetes')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['discovery-client']}")
    }
    api project(':infrastructure.event.event-handler-decorator')
    switch (rootProject.ext.appStack['messaging']) {
        case 'kafka':
            api project(':infrastructure.messaging.kafka.adapter.user')
            break
        case 'sns':
            api project(':infrastructure.messaging.sns.adapter.user')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['messaging']}")
    }
    switch (rootProject.ext.appStack['migration']) {
        case 'flyway':
            switch (rootProject.ext.appStack['datasource']) {
                case 'mysql':
                    api project(':infrastructure.migration.flyway.mysql.adapter.user')
                    break
                case 'postgres':
                    api project(':infrastructure.migration.flyway.postgres.adapter.user')
                    break
                default:
                    throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['datasource']}")
            }
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['migration']}")
    }
    api project(':infrastructure.observability.actuator')
    switch (rootProject.ext.appStack['observability.logging.framework']) {
        case 'logback':
            api project(':infrastructure.observability.logging.logback')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['observability.logging.framework']}")
    }
    switch (rootProject.ext.appStack['observability.metrics']) {
        case 'prometheus':
            api project(':infrastructure.observability.metrics.prometheus')
            break
        case 'cloudwatch':
            api project(':infrastructure.observability.metrics.cloudwatch')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['observability.metrics']}")
    }
    switch (rootProject.ext.appStack['observability.tracing']) {
        case 'zipkin':
            api project(':infrastructure.observability.tracing.zipkin')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['observability.tracing']}")
    }
    switch (rootProject.ext.appStack['persistence']) {
        case 'jpa':
            api project(':infrastructure.persistence.jpa.adapter.user')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['persistence']}")
    }
    switch (rootProject.ext.appStack['scheduler']) {
        case 'spring':
            api project(':infrastructure.scheduler.spring.adapter.user')
            break
        case 'quartz':
            api project(':infrastructure.scheduler.quartz.adapter.user')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['scheduler']}")
    }
    api project(':infrastructure.use-case.use-case-handler-decorator')

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

test {
    useJUnitPlatform()
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}
