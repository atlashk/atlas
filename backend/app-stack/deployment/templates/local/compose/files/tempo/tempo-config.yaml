server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:                      # Configure protocols to ingest traces
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local                # Use 's3', 'gcs', or 'azure' for production
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
