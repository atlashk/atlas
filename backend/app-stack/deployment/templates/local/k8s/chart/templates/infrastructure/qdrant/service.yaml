{{- $appStack := get .Values "appStack" | default dict }}
{{- $ai := get $appStack "ai" | default dict }}
{{- $vectorstore := get $ai "vectorstore" | default dict }}
{{- if (get $vectorstore "qdrant" | default false) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ lower $.Release.Name }}-qdrant
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/instance: {{ lower $.Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/instance: {{ lower $.Release.Name }}
  ports:
    - name: http
      port: {{ .Values.qdrant.service.ports.http }}
      targetPort: http
    - name: grpc
      port: {{ .Values.qdrant.service.ports.grpc }}
      targetPort: grpc
{{- end }}
