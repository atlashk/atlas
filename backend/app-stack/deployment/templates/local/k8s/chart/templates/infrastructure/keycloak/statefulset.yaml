{{- if eq .Values.appStack.identity "keycloak" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ lower $.Release.Name }}-keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ lower $.Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.global.replicaCount }}
  serviceName: keycloak
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
      app.kubernetes.io/instance: {{ lower $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/instance: {{ lower $.Release.Name }}
    spec:
      containers:
        - name: keycloak
          image: "{{ .Values.keycloak.image.repository }}:{{ .Values.keycloak.image.tag }}"
          imagePullPolicy: IfNotPresent
          args: ["start-dev", "--import-realm"]
          env:
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ lower $.Release.Name }}-keycloak
                  key: admin-username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ lower $.Release.Name }}-keycloak
                  key: admin-password
            {{- if eq .Values.appStack.datasource "postgres" }}
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: "jdbc:postgresql://postgres:{{ .Values.postgres.service.ports.postgres }}/db_keycloak"
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ lower $.Release.Name }}-postgres
                  key: user
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ lower $.Release.Name }}-postgres
                  key: password
            {{- end }}
            {{- if eq .Values.appStack.datasource "mysql" }}
            - name: KC_DB
              value: "mysql"
            - name: KC_DB_URL
              value: "jdbc:mysql://mysql:{{ .Values.mysql.service.ports.mysql }}/db_keycloak?useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false"
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ lower $.Release.Name }}-mysql
                  key: user
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ lower $.Release.Name }}-mysql
                  key: password
            {{- end }}
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_HTTP_MANAGEMENT_PORT
              value: "9000"
            - name: KC_METRICS_ENABLED
              value: "true"
          volumeMounts:
            - name: keycloak-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          startupProbe:
            httpGet:
              path: /health/started
              port: 9000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{ toYaml .Values.keycloak.resources | nindent 12 }}
      volumes:
        - name: keycloak-import
          configMap:
            name: keycloak-import
{{- end }}
