apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ lower $.Release.Name }}-authorization-server
  labels:
    app.kubernetes.io/name: authorization-server
    app.kubernetes.io/instance: {{ lower $.Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.global.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: authorization-server
      app.kubernetes.io/instance: {{ lower $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authorization-server
        app.kubernetes.io/instance: {{ lower $.Release.Name }}
    spec:
      {{- with .Values.nodeGroups.application.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeGroups.application.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ lower $.Release.Name }}-{{ .Values.global.serviceAccount.name }}
      {{- $deps := list -}}
      {{- if eq .Values.appStack.datasource "mysql" -}}
      {{- $deps = append $deps (dict "name" "mysql" "host" (printf "%s-mysql" (lower $.Release.Name)) "port" .Values.mysql.service.ports.mysql) -}}
      {{- end -}}
      {{- if eq .Values.appStack.datasource "postgres" -}}
      {{- $deps = append $deps (dict "name" "postgres" "host" (printf "%s-postgres" (lower $.Release.Name)) "port" .Values.postgres.service.ports.postgres) -}}
      {{- end -}}
      {{- if eq .Values.appStack.kvStore "redis" -}}
      {{- $deps = append $deps (dict "name" "redis" "host" (printf "%s-redis" (lower $.Release.Name)) "port" .Values.redis.service.ports.redis) -}}
      {{- end -}}
      {{- include "atlas.waitFor.initContainers" (dict "deps" $deps) | nindent 6 }}
      containers:
        - name: authorization-server
          image: "{{ if .Values.global.image.registry -}}{{ .Values.global.image.registry }}/{{ end -}}{{ .Release.Namespace }}/{{ .Values.authorizationServer.image.repository }}:{{ .Values.authorizationServer.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.authorizationServer.service.ports.http }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.global.springProfilesActive | quote }}
            {{- if eq .Values.appStack.datasource "mysql" }}
            - name: DB_URL
              value: "jdbc:mysql://{{ lower $.Release.Name }}-mysql:{{ .Values.mysql.service.ports.mysql }}/db_user?useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ lower $.Release.Name }}-mysql
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ lower $.Release.Name }}-mysql
                  key: password
            {{- end }}
            {{- if eq .Values.appStack.datasource "postgres" }}
            - name: DB_URL
              value: "jdbc:postgresql://postgres:{{ .Values.postgres.service.ports.postgres }}/db_user"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ lower $.Release.Name }}-postgres
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ lower $.Release.Name }}-postgres
                  key: password
            {{- end }}
            {{- if eq .Values.appStack.kvStore "redis" }}
            - name: REDIS_HOST
              value: "{{ lower $.Release.Name }}-redis"
            - name: REDIS_PORT
              value: {{ .Values.redis.service.ports.redis | quote }}
            {{- end }}
            {{- if eq .Values.appStack.observability.tracing "zipkin" }}
            - name: ZIPKIN_ENDPOINT
              value: "http://{{ lower $.Release.Name }}-zipkin:{{ .Values.zipkin.service.ports.http }}/api/v2/spans"
            {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{ toYaml .Values.authorizationServer.resources | nindent 12 }}
          volumeMounts:
            - name: authorization-server-logs
              mountPath: /var/log/authorization-server
      volumes:
        - name: authorization-server-logs
          emptyDir: {} # Log volume changed to emptyDir for Promtail compatibility
      terminationGracePeriodSeconds: 30
