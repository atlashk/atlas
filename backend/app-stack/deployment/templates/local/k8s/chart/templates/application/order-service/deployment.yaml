apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ lower $.Release.Name }}-order-service
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/instance: {{ lower $.Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.global.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
      app.kubernetes.io/instance: {{ lower $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
        app.kubernetes.io/instance: {{ lower $.Release.Name }}
    spec:
      serviceAccountName: {{ .Values.global.serviceAccount.name }}
      containers:
        - name: order-service
          image: "{{ .Values.global.image.registry }}/{{ .Values.orderSvc.image.repository }}:{{ .Values.orderSvc.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.orderSvc.service.ports.http }}
          env:
            {{- if eq .Values.appStack.datasource "mysql" }}
            - name: DB_URL
              value: "jdbc:mysql://mysql:{{ .Values.mysql.service.ports.mysql }}/db_order?useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql
                  key: password
            {{- end }}
            {{- if eq .Values.appStack.datasource "postgres" }}
            - name: DB_URL
              value: "jdbc:postgresql://postgres:{{ .Values.postgres.service.ports.postgres }}/db_order"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
            {{- end }}
            {{- if eq .Values.appStack.kvStore "redis" }}
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: {{ .Values.redis.service.ports.redis | quote }}
            {{- end }}
            {{- if eq .Values.appStack.messaging "kafka" }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:{{ .Values.kafka.service.ports.kafkaInternal }}"
            {{- end }}
            {{- if eq .Values.appStack.messaging "rabbitmq" }}
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_PORT
              value: {{ .Values.rabbitmq.service.ports.amqp | quote }}
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq
                  key: user
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq
                  key: password
            {{- end }}
            {{- if eq .Values.appStack.internal "grpc" }}
            - name: API_CLIENT_GRPC_IDENTITY_SERVICE_ADDRESS
              value: "static://identity-service:{{ .Values.identitySvc.service.ports.grpc }}"
            - name: API_CLIENT_GRPC_CATALOG_SERVICE_ADDRESS
              value: "static://catalog-service:{{ .Values.catalogSvc.service.ports.grpc }}"
            {{- end }}
            {{- if eq .Values.appStack.internal "rest" }}
            - name: API_CLIENT_REST_IDENTITY_SERVICE_BASE_URL
              value: "http://identity-service:{{ .Values.identitySvc.service.ports.http }}"
            - name: API_CLIENT_REST_CATALOG_SERVICE_BASE_URL
              value: "http://catalog-service:{{ .Values.catalogSvc.service.ports.http }}"
            {{- end }}
            {{- if eq .Values.appStack.observability.tracing "zipkin" }}
            - name: ZIPKIN_ENDPOINT
              value: "http://zipkin:{{ .Values.zipkin.service.ports.http }}/api/v2/spans"
            {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{ toYaml .Values.orderSvc.resources | nindent 12 }}
          volumeMounts:
            - name: order-service-logs
              mountPath: /var/log/order-service
      volumes:
        - name: order-service-logs
          emptyDir: {} # Log volume changed to emptyDir for Promtail compatibility
      terminationGracePeriodSeconds: 30
