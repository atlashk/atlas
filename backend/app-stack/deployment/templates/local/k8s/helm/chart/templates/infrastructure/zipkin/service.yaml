{{- if eq .Values.appStack.observability.tracing "zipkin" }}
apiVersion: v1
kind: Service
metadata:
  name: zipkin
  labels:
    app.kubernetes.io/name: zipkin
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  type: {{ .Values.global.service.type }}
  selector:
    app: zipkin
  ports:
    - name: http
      port: {{ .Values.zipkin.service.ports.http }}
      targetPort: http
{{- end }}
