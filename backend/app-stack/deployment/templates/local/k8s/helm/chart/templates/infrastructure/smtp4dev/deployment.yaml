{{- if eq .Values.appStack.notification.email "spring" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smtp4dev
  labels:
    app.kubernetes.io/name: smtp4dev
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.global.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: smtp4dev
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smtp4dev
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: smtp4dev
          image: "{{ .Values.smtp4dev.image.repository }}:{{ .Values.smtp4dev.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: ServerOptions__HostName
              value: "smtp4dev"
          ports:
            - name: http
              containerPort: 80
            - name: smtp
              containerPort: 25
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
{{- end }}
