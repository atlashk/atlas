apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.order.fullName }}
  labels:
    app.kubernetes.io/name: {{ .Values.order.fullName }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  type: {{ .Values.global.service.type }}
  selector:
    app.kubernetes.io/name: {{ .Values.order.fullName }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.order.service.rest.port }}
      targetPort: {{ .Values.order.service.rest.targetPort }}
      name: http
