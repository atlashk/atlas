apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.identity.fullName }}
  labels:
    app.kubernetes.io/name: {{ .Values.identity.fullName }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  type: {{ .Values.global.service.type }}
  selector:
    app.kubernetes.io/name: {{ .Values.identity.fullName }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.identity.ports.http }}
      targetPort: {{ .Values.identity.ports.http }}
      name: http
    {{- if eq .Values.appStack.internal "grpc" }}
    - port: {{ .Values.identity.ports.grpc }}
      targetPort: {{ .Values.identity.ports.grpc }}
      name: grpc
    {{- end }}
