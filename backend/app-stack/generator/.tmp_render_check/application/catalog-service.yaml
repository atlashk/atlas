# Log volume changed to emptyDir for Promtail compatibility
# PersistentVolumeClaim removed - logs now use emptyDir volume
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: atlas
  labels:
    app: catalog-service
    tier: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
        tier: application
    spec:
      containers:
        - name: catalog-service
          image: atlas/catalog-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: DB_URL
              value: "jdbc:mysql://mysql:3306/db_catalog?useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false"
            - name: DB_USERNAME
              value: "atlas"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-password
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:29092"
            - name: ELASTICSEARCH_HOST
              value: "elasticsearch"
            - name: ELASTICSEARCH_PORT
              value: "9200"
            - name: ELASTICSEARCH_USERNAME
              value: "elastic"
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-secret
                  key: elasticsearch-password
            - name: MINIO_ENDPOINT
              value: "http://minio:9000"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: secret-key
            - name: ZIPKIN_ENDPOINT
              value: "http://zipkin:9411/api/v2/spans"
          # startupProbe gives the Spring Boot app up to 5 min (30 × 10 s) to finish starting
          # before liveness/readiness probes are allowed to run. This prevents premature restarts.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          # livenessProbe restarts the container if the app becomes unresponsive after startup.
          # Quick failure detection (3 × 30 s) without being overly aggressive.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          # readinessProbe removes the pod from service endpoints while it is still starting
          # or if it becomes temporarily unavailable. Checks every 10 s for fast traffic routing.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: catalog-service-logs
              mountPath: /var/log/catalog-service
      volumes:
        - name: catalog-service-logs
          emptyDir: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: atlas
  labels:
    app: catalog-service
    tier: application
spec:
  selector:
    app: catalog-service
  ports:
    - port: 8082
      targetPort: 8082
      name: http
  type: ClusterIP