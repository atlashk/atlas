plugins {
    id 'java'
    id 'org.springframework.boot' version "${springBootPluginVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementPluginVersion}"
    id 'idea'
}

group = 'org.atlas'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Application (included Domain)
    implementation project(':application.product')

    // Infrastructure
    implementation project(':infrastructure.api-server.rest.adapter.product')
    if (rootProject.ext.appStack['internal-api'] == 'grpc') {
        implementation project(':infrastructure.api-server.grpc.adapter.product')
    }
    switch (rootProject.ext.appStack['datasource']) {
        case 'mysql':
            implementation project(':infrastructure.datasource.mysql.adapter.product')
            break
        case 'postgres':
            implementation project(':infrastructure.datasource.postgres.adapter.product')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['datasource']}")
    }
    switch (rootProject.ext.appStack['discovery-client']) {
        case 'none':
            break
        case 'eureka':
            implementation project(':infrastructure.discovery-client.eureka')
            break
        case 'kubernetes':
            implementation project(':infrastructure.discovery-client.kubernetes')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['discovery-client']}")
    }
    switch (rootProject.ext.appStack['file.csv']) {
        case 'opencsv':
            implementation project(':infrastructure.file.csv.opencsv.adapter.product')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['file.csv']}")
    }
    switch (rootProject.ext.appStack['file.excel']) {
        case 'easyexcel':
            implementation project(':infrastructure.file.excel.easyexcel.adapter.product')
            break
        case 'poi':
            implementation project(':infrastructure.file.excel.poi.adapter.product')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['file.excel']}")
    }
    switch (rootProject.ext.appStack['file.pdf']) {
        case 'pdfbox':
            implementation project(':infrastructure.file.pdf.pdfbox.adapter.product')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['file.pdf']}")
    }
    switch (rootProject.ext.appStack['kv-store']) {
        case 'redis':
            implementation project(':infrastructure.kv-store.redis')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['kv-store']}")
    }
    switch (rootProject.ext.appStack['messaging']) {
        case 'kafka':
            implementation project(':infrastructure.messaging.kafka.adapter.product')
            break
        case 'rabbitmq':
            implementation project(':infrastructure.messaging.rabbitmq.adapter.product')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['messaging']}")
    }
    switch (rootProject.ext.appStack['migration']) {
        case 'flyway':
            switch (rootProject.ext.appStack['datasource']) {
                case 'mysql':
                    implementation project(':infrastructure.migration.flyway.mysql.adapter.product')
                    implementation project(':infrastructure.migration.flyway.mysql.adapter.outbox')
                    break
                case 'postgres':
                    implementation project(':infrastructure.migration.flyway.postgres.adapter.product')
                    implementation project(':infrastructure.migration.flyway.postgres.adapter.outbox')
                    break
                default:
                    throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['datasource']}")
            }
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['migration']}")
    }
    implementation project(':infrastructure.observability.actuator')
    switch (rootProject.ext.appStack['observability.logging.framework']) {
        case 'logback':
            implementation project(':infrastructure.observability.logging.logback')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['observability.logging.framework']}")
    }
    switch (rootProject.ext.appStack['observability.metrics']) {
        case 'none':
            break
        case 'prometheus':
            implementation project(':infrastructure.observability.metrics.prometheus')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['observability.metrics']}")
    }
    switch (rootProject.ext.appStack['observability.tracing']) {
        case 'none':
            break
        case 'zipkin':
            implementation project(':infrastructure.observability.tracing.zipkin')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['observability.tracing']}")
    }
    switch (rootProject.ext.appStack['persistence']) {
        case 'jpa':
            implementation project(':infrastructure.persistence.jpa.adapter.product')
            implementation project(':infrastructure.persistence.jpa.adapter.outbox')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['persistence']}")
    }
    switch (rootProject.ext.appStack['scheduler']) {
        case 'spring':
            implementation project(':infrastructure.scheduler.spring.adapter.outbox')
            break
        case 'quartz':
            implementation project(':infrastructure.scheduler.quartz.adapter.outbox')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['scheduler']}")
    }
    switch (rootProject.ext.appStack['full-text-search']) {
        case 'none':
            break
        case 'elasticsearch':
            implementation project(':infrastructure.full-text-search.elasticsearch.adapter.product')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['full-text-search']}")
    }
    switch (rootProject.ext.appStack['storage']) {
        case 'filesystem':
            implementation project(':infrastructure.storage.filesystem')
            break
        case 'minio':
            implementation project(':infrastructure.storage.minio')
            break
        default:
            throw new IllegalArgumentException("Unsupported ${rootProject.ext.appStack['storage']}")
    }

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

test {
    useJUnitPlatform()
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}
