apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: atlas-base
  labels:
    project: atlas
    environment: base

# Base infrastructure components
resources:
  # Infrastructure services
  - infrastructure/mysql.yaml
  - infrastructure/redis.yaml
  - infrastructure/kafka.yaml
  - infrastructure/rabbitmq.yaml
  - infrastructure/smtp4dev.yaml
  
  # Core microservices
  - microservices/user-service.yaml
  - microservices/product-service.yaml
  - microservices/order-service.yaml
  - microservices/notification-service.yaml
  - microservices/api-gateway.yaml
  - microservices/auth-server.yaml
  
  # Observability
  - observability

# Common labels for all resources
commonLabels:
  project: atlas
  managed-by: kustomize

# Common annotations
commonAnnotations:
  atlas.org/version: "1.0.0"
  atlas.org/managed-by: "kustomize"

# Generate config map for common configuration
configMapGenerator:
  - name: atlas-config
    literals:
      - project=atlas
      - version=1.0.0
      - platform=kubernetes

# Images with specific tags for consistency
images:
  - name: mysql
    newTag: "8.0"
  - name: redis
    newTag: "7-alpine"
  - name: confluentinc/cp-kafka
    newTag: "7.9.0"
  - name: rabbitmq
    newTag: "3.13-management-alpine"
  - name: rnwood/smtp4dev
    newTag: "v3"

# Resource transformations
replicas:
  - name: mysql
    count: 1
  - name: redis
    count: 1
  - name: kafka
    count: 1
  - name: rabbitmq
    count: 1
  - name: smtp4dev
    count: 1
