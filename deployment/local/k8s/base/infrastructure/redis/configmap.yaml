apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  labels:
    app: redis
    tier: infrastructure
data:
  redis.conf: |
    # Redis configuration for Atlas platform
    
    # Memory management
    maxmemory 256mb
    maxmemory-policy allkeys-lru
    
    # Persistence
    appendonly yes
    appendfsync everysec
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    
    # Network
    timeout 0
    tcp-keepalive 300
    
    # Logging
    loglevel notice
    
    # Performance
    tcp-backlog 511
    databases 16
    
    # Security (for local development)
    protected-mode no
    
    # Disable some potentially dangerous commands in production
    # rename-command FLUSHDB ""
    # rename-command FLUSHALL "" 
