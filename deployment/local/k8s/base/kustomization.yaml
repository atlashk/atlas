apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: atlas-base
  labels:
    project: atlas
    environment: base

# Base infrastructure components
resources:
  # Infrastructure services
  - infrastructure/mysql
  - infrastructure/redis
  - infrastructure/kafka
  - infrastructure/rabbitmq
  
  # Core microservices
  - microservices/user-service
  - microservices/product-service
  - microservices/order-service
  - microservices/notification-service
  - microservices/api-gateway
  - microservices/auth-server
  
  # Observability
  - observability

# Common labels for all resources
commonLabels:
  project: atlas
  managed-by: kustomize

# Common annotations
commonAnnotations:
  atlas.org/version: "1.0.0"
  atlas.org/managed-by: "kustomize"

# Generate config map for common configuration
configMapGenerator:
  - name: atlas-config
    literals:
      - project=atlas
      - version=1.0.0
      - platform=kubernetes

# Images with specific tags for consistency
images:
  - name: mysql
    newTag: "8.0"
  - name: redis
    newTag: "7-alpine"
  - name: confluentinc/cp-kafka
    newTag: "7.9.0"

# Resource transformations
replicas:
  - name: mysql
    count: 1
  - name: redis
    count: 1
  - name: kafka
    count: 1
