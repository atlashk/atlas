apiVersion: v1
kind: Service
metadata:
  name: product-service
  labels:
    app: product-service

    tier: backend
spec:
  selector:
    app: product-service
  ports:
    - port: 8082
      targetPort: 8082
      name: http
    - port: 50052
      targetPort: 50052
      name: grpc
  type: ClusterIP 
