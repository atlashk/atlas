apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notification-service-logs
  labels:
    app: notification-service
    tier: application
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: hostpath  # Use Docker Desktop default storage class
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app: notification-service
    tier: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        tier: application
    spec:
      containers:
        - name: notification-service
          image: notification-service:latest
          imagePullPolicy: Never
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: atlas-${ENVIRONMENT}-config
                  key: SPRING_PROFILES_ACTIVE
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: atlas-${ENVIRONMENT}-config
                  key: LOG_LEVEL
            - name: SERVER_PORT
              value: "8084"
            # Database configuration
            - name: MYSQL_URL
              value: "jdbc:mysql://mysql:3306/db_notification?useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false"
            - name: MYSQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-password
            - name: MYSQL_QUARTZ_URL
              value: "jdbc:mysql://mysql:3306/db_quartz?useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false"
            # Redis configuration
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            # Kafka configuration
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:29092"
            # Service discovery disabled (using K8s DNS)
            - name: SPRING_CLOUD_DISCOVERY_ENABLED
              value: "false"
            # SMTP configuration
            - name: MAIL_SERVER_HOST
              value: "smtp4dev"
            # Observability
            - name: ZIPKIN_ENDPOINT
              value: "http://zipkin:9411/api/v2/spans"
          ports:
            - containerPort: 8084
              name: http
          # Health checks
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          # Resource optimization
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: notification-service-logs
              mountPath: /var/log/notification-service
      volumes:
        - name: notification-service-logs
          persistentVolumeClaim:
            claimName: notification-service-logs
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels:
    app: notification-service
    tier: application
spec:
  selector:
    app: notification-service
  ports:
    - port: 8084
      targetPort: 8084
      name: http
  type: ClusterIP 
