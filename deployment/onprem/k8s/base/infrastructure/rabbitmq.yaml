apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  labels:
    app: rabbitmq
    tier: infrastructure
type: Opaque
data:
  # Default credentials: admin/admin (base64 encoded)
  rabbitmq-username: YWRtaW4=  # admin
  rabbitmq-password: YWRtaW4=  # admin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  labels:
    app: rabbitmq
    tier: infrastructure
data:
  # Enable management plugin and delayed message exchange
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_delayed_message_exchange].
  
  # Setup script for creating exchanges and queues
  rabbitmq-setup.sh: |
    #!/bin/bash
    
    # Wait for RabbitMQ to be ready
    until rabbitmqctl status > /dev/null 2>&1; do
        echo "Waiting for RabbitMQ to start..."
        sleep 5
    done
    
    ORDER_EXCHANGE="order_events"
    QUEUES=(
      "order_events.order"
      "order_events.product"
      "order_events.user"
      "order_events.notification"
      "order_events.report"
    )
    
    # Declare exchange
    echo "Declaring exchange: ${ORDER_EXCHANGE}"
    rabbitmqadmin declare exchange name=${ORDER_EXCHANGE} type=fanout durable=true
    
    # Declare queues and bindings
    for queue in "${QUEUES[@]}"; do
      echo "Declaring queue $queue and binding it to exchange $ORDER_EXCHANGE"
      rabbitmqadmin declare queue name="$queue" durable=true
      rabbitmqadmin declare binding source="$ORDER_EXCHANGE" destination="$queue"
    done
    
    echo "RabbitMQ setup completed successfully!"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
  labels:
    app: rabbitmq
    tier: infrastructure
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: hostpath  # Use Docker Desktop default storage class
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
    tier: infrastructure
spec:
  replicas: 1
  strategy:
    type: Recreate  # Use Recreate for message broker to avoid conflicts
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
        tier: infrastructure
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: rabbitmq-username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: rabbitmq-password
            - name: RABBITMQ_ERLANG_COOKIE
              value: "atlas-rabbitmq-cookie"
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
            - name: rabbitmq-config
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins
          # Health checks
          livenessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - check_port_connectivity
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          # Resource limits
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: rabbitmq-data
          persistentVolumeClaim:
            claimName: rabbitmq-data
        - name: rabbitmq-config
          configMap:
            name: rabbitmq-config
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
    tier: infrastructure
spec:
  selector:
    app: rabbitmq
  ports:
    - port: 5672
      targetPort: 5672
      name: amqp
    - port: 15672
      targetPort: 15672
      name: management
  type: ClusterIP
