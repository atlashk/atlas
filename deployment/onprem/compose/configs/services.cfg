# Service configurations for Atlas deployment
# This file contains the list of services for each category

# Backend services
BACKEND_SERVICES=(
    "eureka-server"
    "user-service"
    "product-service"
    "order-service"
    "notification-service"
    "auth-server"
    "api-gateway"
)

# Infrastructure services
INFRA_SERVICES=(
    "mysql"
    "redis"
    "kafka"
    "smtp4dev"
)

# Observability services
OBSERVABILITY_SERVICES=(
    "loki"
    "promtail"
    "prometheus"
    "zipkin"
    "grafana"
)

# Custom images that should be removed (built locally)
BACKEND_IMAGES=(
    "eureka-server:latest"
    "user-service:latest"
    "product-service:latest"
    "order-service:latest"
    "notification-service:latest"
    "auth-server:latest"
    "api-gateway:latest"
)

# All volumes used across compose files
ALL_VOLUMES=(
    "mysql-data"
    "redis-data"
    "kafka-data"
    "smtp4dev-data"
    "eureka-server-log"
    "user-service-log"
    "product-service-log"
    "order-service-log"
    "notification-service-log"
    "auth-server-log"
    "api-gateway-log"
    "grafana-data"
)
